<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">

<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">

<link rel="icon" type="image/png" sizes="64x64" href="icons/favicon.png">
<style>
  :root{
    --bg:#f4f6fb;
    --surface:#ffffff;
    --surface-2:#eef1f8;
    --ink:#1b2436;
    --ink-soft:#6b7280;
    --ink-faint:#9aa1b2;
    --line:#e3e7f0;
    --primary:#3457d5;
    --primary-deep:#233c9e;
    --primary-soft:#e8edfc;
    --amber:#c97a1f;
    --amber-soft:#faf0dd;
    --teal:#0f9d8c;
    --teal-soft:#e1f5f2;
    --red:#d24b4b;
    --red-soft:#fbe8e8;
    --radius:14px;
    --radius-sm:10px;
    --shadow:0 1px 2px rgba(20,25,40,.04), 0 8px 24px -14px rgba(20,25,40,.18);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;background:var(--bg);color:var(--ink);padding-top:env(safe-area-inset-top);padding-bottom:env(safe-area-inset-bottom);padding-left:env(safe-area-inset-left);padding-right:env(safe-area-inset-right);}
  h1,h2,h3,h4{margin:0;}
  button{font-family:inherit;cursor:pointer;}
  input,textarea,select{font-family:inherit;}
  .num{font-variant-numeric:tabular-nums;}
  .ic{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex-shrink:0;}

  header.top{position:sticky;top:0;z-index:40;background:var(--surface);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:14px;padding:12px 22px;}
  button.brand{background:none;border:none;padding:0;text-align:left;color:inherit;font:inherit;}
  .brand{display:flex;align-items:center;gap:12px;cursor:pointer;user-select:none;-webkit-user-select:none;transition:opacity .15s,transform .1s;}
  .brand *{pointer-events:none;}
  .brand:hover{opacity:.88;}
  .brand:active{opacity:.72;transform:scale(0.98);}
  .brand .logo{width:40px;height:40px;border-radius:11px;background:linear-gradient(135deg,var(--primary),var(--primary-deep));display:flex;align-items:center;justify-content:center;color:#fff;}
  .brand .logo .ic{width:22px;height:22px;stroke:#fff;}
  .brand h1{font-size:16.5px;font-weight:800;letter-spacing:.1px;}
  .brand .ver{font-size:10.5px;color:var(--ink-faint);background:var(--surface-2);padding:2px 8px;border-radius:999px;margin-left:8px;font-weight:700;vertical-align:2px;}
  header.top .spacer{flex:1;}
  .teacherbox{display:flex;align-items:center;gap:10px;background:var(--surface-2);padding:6px 8px 6px 14px;border-radius:999px;cursor:pointer;border:none;}
  .teacherbox .who{text-align:right;line-height:1.25;}
  .teacherbox .name{font-size:13px;font-weight:700;color:var(--ink);}
  .teacherbox .branch{font-size:11px;color:var(--red);font-weight:700;}
  .teacherbox .av{width:30px;height:30px;border-radius:50%;background:var(--primary);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:12px;}

  main#app{padding:26px 30px 70px;max-width:1180px;margin:0 auto;}

  .crumbs{font-size:12.5px;color:var(--ink-soft);margin-bottom:4px;font-weight:600;}
  .pagehead{display:flex;align-items:center;gap:12px;margin-bottom:20px;flex-wrap:wrap;}
  .pagehead h2{font-size:22px;font-weight:800;}
  .pagehead .sub{color:var(--ink-soft);font-size:13px;}
  .pagehead .spacer{flex:1;}
  .backlink{display:inline-flex;align-items:center;gap:5px;color:var(--primary-deep);font-weight:700;text-decoration:none;font-size:13.5px;cursor:pointer;margin-bottom:12px;border:none;background:none;padding:0;}

  .btn{border:none;padding:10px 16px;border-radius:10px;font-weight:700;font-size:13.5px;display:inline-flex;align-items:center;gap:7px;}
  .btn-primary{background:var(--primary);color:#fff;}
  .btn-soft{background:var(--primary-soft);color:var(--primary-deep);}
  .btn-outline{background:var(--surface);color:var(--ink);border:1px solid var(--line);}
  .btn-danger{background:var(--red-soft);color:var(--red);}
  .btn-sm{padding:7px 11px;font-size:12.5px;border-radius:8px;}
  .btn:disabled{opacity:.5;cursor:default;}
  .btn.full{width:100%;justify-content:center;}

  .section-title{font-size:12.5px;text-transform:uppercase;letter-spacing:.06em;color:var(--ink-soft);font-weight:800;margin:26px 0 12px;display:flex;align-items:center;gap:10px;}
  .section-title .line{flex:1;height:1px;background:var(--line);}
  .section-title:first-child{margin-top:0;}

  .classgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:16px;}
  .classcard{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:20px;cursor:pointer;box-shadow:var(--shadow);border-top:4px solid var(--primary);}
  .classcard h3{font-size:19px;margin-bottom:4px;}
  .classcard .tags{display:flex;gap:6px;flex-wrap:wrap;}
  .tag{font-size:10.5px;font-weight:800;padding:3px 9px;border-radius:999px;white-space:nowrap;}
  .tag.blue{background:var(--primary-soft);color:var(--primary-deep);}
  .tag.amber{background:var(--amber-soft);color:var(--amber);}
  .tag.teal{background:var(--teal-soft);color:var(--teal);}
  .addcard{display:flex;align-items:center;justify-content:center;flex-direction:column;gap:8px;border:2px dashed var(--line);border-radius:var(--radius);padding:20px;cursor:pointer;color:var(--ink-soft);font-weight:700;font-size:13.5px;min-height:118px;background:transparent;}
  .addcard:hover{border-color:var(--primary);color:var(--primary-deep);}

  .card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:16px;margin-bottom:10px;box-shadow:var(--shadow);}
  .infobar{display:flex;gap:22px;flex-wrap:wrap;align-items:center;background:var(--primary-soft);border-radius:var(--radius);padding:14px 18px;margin-bottom:18px;}
  .infobar .item .v{font-size:19px;font-weight:800;color:var(--primary-deep);}
  .infobar .item .k{font-size:11.5px;color:var(--primary-deep);opacity:.75;font-weight:700;}

  .actionrow{display:flex;gap:10px;margin-bottom:14px;flex-wrap:wrap;}
  .actionrow .btn{flex:1;min-width:170px;justify-content:center;}

  .rowcard{display:flex;align-items:center;gap:12px;padding:12px 14px;cursor:pointer;}
  .rowcard .no{font-size:11.5px;color:var(--ink-faint);min-width:36px;padding:0 4px;flex-shrink:0;text-align:center;font-weight:700;white-space:nowrap;font-variant-numeric:tabular-nums;}
  .rowcard .name{flex:1;font-size:14.5px;font-weight:700;}
  .rowcard .pct{font-size:12.5px;font-weight:800;padding:4px 10px;border-radius:999px;background:var(--teal-soft);color:var(--teal);min-width:46px;text-align:center;}
  .rowcard .pct.low{background:var(--red-soft);color:var(--red);}
  .rowcard .pct.mid{background:var(--amber-soft);color:var(--amber);}
  .rowcard .chev{color:var(--ink-faint);}
  .rowcard .chev .ic{width:16px;height:16px;}

  .field{background:var(--surface-2);border-radius:10px;padding:8px;text-align:center;}
  .field label{display:block;font-size:10.5px;color:var(--ink-soft);margin-bottom:4px;text-transform:uppercase;letter-spacing:.03em;font-weight:700;}
  .field input{width:100%;border:none;background:transparent;text-align:center;font-size:15px;font-weight:800;color:var(--primary-deep);}
  .field input:focus{outline:2px solid var(--primary);border-radius:6px;}
  .detail-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:8px;}

  .hwrow{display:flex;align-items:center;gap:12px;padding:11px 4px;border-bottom:1px solid var(--line);}
  .hwrow:last-child{border-bottom:none;}
  .hwrow .topic{flex:1;}
  .hwrow .topic .t{font-size:14px;font-weight:700;}
  .hwrow .topic .d{font-size:11.5px;color:var(--ink-soft);}
  .hwrow.future .topic .t,.hwrow.future .topic .d{color:var(--ink-faint);font-style:italic;}

  .toggle{width:48px;height:28px;border-radius:999px;background:#dfe3ee;position:relative;flex-shrink:0;border:none;}
  .toggle.on{background:var(--teal);}
  .toggle .knob{position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#fff;transition:left .15s ease;box-shadow:0 1px 3px rgba(0,0,0,.28);}
  .toggle.on .knob{left:23px;}
  .toggle:disabled{opacity:.4;}

  textarea.note{width:100%;border:1px solid var(--line);border-radius:10px;padding:10px;font-family:inherit;font-size:13.5px;min-height:70px;resize:vertical;background:var(--surface);}

  .listedit-row{display:flex;gap:8px;align-items:flex-start;padding:12px 0;border-bottom:1px solid var(--line);flex-wrap:wrap;}
  .listedit-row:last-child{border-bottom:none;}
  .listedit-row .slot{width:24px;font-size:11.5px;color:var(--ink-faint);font-weight:800;padding-top:9px;}
  .listedit-row input[type=text]{flex:2;min-width:160px;border:1px solid var(--line);border-radius:8px;padding:9px;font-size:13.5px;}
  .listedit-row input[type=date]{border:1px solid var(--line);border-radius:8px;padding:9px;font-size:12.5px;}
  .listedit-row .datewrap{display:flex;flex-direction:column;gap:3px;}
  .listedit-row .datewrap label{font-size:10px;color:var(--ink-soft);font-weight:700;}
  .iconbtn{border:none;background:none;color:var(--red);padding:6px;border-radius:8px;}
  .iconbtn:hover{background:var(--red-soft);}
  .iconbtn .ic{width:17px;height:17px;}

  .scoregrid{display:flex;flex-direction:column;}
  .scorerow{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid var(--line);}
  .scorerow:last-child{border-bottom:none;}
  .scorerow .no{min-width:36px;padding:0 4px;font-size:11.5px;color:var(--ink-faint);font-weight:700;text-align:center;flex-shrink:0;white-space:nowrap;font-variant-numeric:tabular-nums;}
  .scorerow .name{flex:1;font-size:14px;font-weight:700;}
  .scorerow input{width:70px;border:1px solid var(--line);border-radius:8px;padding:8px;font-size:14px;font-weight:800;text-align:center;color:var(--primary-deep);}

  .levelpicker{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;margin-bottom:14px;}
  .levelpicker button{border:none;background:var(--primary-soft);color:var(--primary-deep);padding:8px 16px;border-radius:999px;font-size:13px;font-weight:700;white-space:nowrap;}
  .levelpicker button.active{background:var(--primary);color:#fff;}
  .levelcard{border:2px solid var(--line);border-radius:12px;padding:12px;margin-bottom:8px;cursor:pointer;}
  .levelcard.sel{border-color:var(--teal);background:var(--teal-soft);}
  .levelcard .lh{display:flex;justify-content:space-between;font-weight:700;font-size:14px;margin-bottom:4px;}
  .levelcard .lh .score{color:var(--primary-deep);}
  .levelcard .desc{font-size:12.5px;color:var(--ink-soft);line-height:1.4;}
  .critblock{margin-bottom:20px;}
  .critblock h3{font-size:14.5px;margin-bottom:8px;color:var(--ink);}
  .critblock .max{font-size:12px;color:var(--ink-soft);font-weight:400;}
  .rubricsummary{display:flex;justify-content:space-between;align-items:center;background:var(--primary);color:#fff;border-radius:var(--radius);padding:14px 16px;margin:16px 0;}
  .rubricsummary .num{font-size:26px;font-weight:800;}
  .rubricsummary .lbl{font-size:11px;opacity:.8;text-transform:uppercase;}
  .studentpicker{display:flex;gap:8px;overflow-x:auto;padding-bottom:8px;margin-bottom:10px;-webkit-overflow-scrolling:touch;}
  .studentpicker button{border:1px solid var(--line);background:var(--surface);padding:8px 14px;border-radius:999px;font-size:13px;white-space:nowrap;}
  .studentpicker button.active{background:var(--teal);border-color:var(--teal);color:#fff;font-weight:700;}

  .empty{text-align:center;padding:40px 20px;color:var(--ink-soft);}
  .empty .big{font-size:34px;margin-bottom:8px;}

  .toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:9px 18px;border-radius:999px;font-size:13px;opacity:0;pointer-events:none;transition:opacity .2s;z-index:80;}
  .toast.show{opacity:.96;}

  .modalbg{position:fixed;inset:0;background:rgba(20,25,40,.42);display:flex;align-items:center;justify-content:center;z-index:70;padding:20px;}
  .modalbox{background:var(--surface);border-radius:16px;padding:24px;width:100%;max-width:420px;max-height:88vh;overflow-y:auto;}
  .modalbox h3{font-size:17px;margin-bottom:14px;}
  .modalbox label{display:block;font-size:12px;font-weight:700;color:var(--ink-soft);margin:14px 0 6px;}
  .modalbox input[type=text], .modalbox input[type=password]{width:100%;border:1px solid var(--line);border-radius:9px;padding:11px;font-size:14px;}
  .modalactions{display:flex;gap:10px;margin-top:20px;}
  .modalactions .btn{flex:1;justify-content:center;}

  .passwrap{position:relative;display:flex;align-items:center;width:100%;}
  .passwrap input{padding-right:42px !important;width:100%;}
  .passwrap .eye-btn{position:absolute;right:8px;top:50%;transform:translateY(-50%);background:none;border:none;cursor:pointer;color:var(--ink-soft);padding:6px;display:inline-flex;align-items:center;justify-content:center;border-radius:6px;line-height:1;transition:color .15s;width:auto !important;margin:0 !important;}
  .passwrap .eye-btn:hover{color:var(--primary);}
  .passwrap .eye-btn .ic{width:18px;height:18px;}

  .loginwrap{min-height:80vh;display:flex;align-items:center;justify-content:center;padding:20px;}
  .loginbox{width:100%;max-width:380px;background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:30px 26px;box-shadow:var(--shadow);}
  .loginbox h2{font-size:21px;color:var(--ink);margin-bottom:4px;text-align:center;}
  .loginbox p.sub{font-size:12.5px;color:var(--ink-soft);text-align:center;margin-bottom:22px;}
  .loginbox label{display:block;font-size:12px;color:var(--ink-soft);margin:14px 0 6px;font-weight:700;}
  .loginbox label:first-of-type{margin-top:0;}
  .loginbox input{width:100%;border:1px solid var(--line);border-radius:10px;padding:12px;font-size:14.5px;font-family:inherit;}
  .loginbox .btn{width:100%;margin-top:20px;justify-content:center;}
  .loginbox .err{color:var(--red);font-size:12.5px;margin-top:12px;text-align:center;min-height:16px;}

  /* FL-27 Styles & Print Support */
  .fl27-banner{background:linear-gradient(135deg,#fff8ed,#fff1db);border:1px solid #ffd8a8;border-left:5px solid var(--amber);border-radius:var(--radius);padding:14px 18px;margin-bottom:16px;}
  .fl27-banner-danger{background:linear-gradient(135deg,#fbe8e8,#fff5f5);border:1px solid #f5c2c2;border-left:5px solid var(--red);border-radius:var(--radius);padding:14px 18px;margin-bottom:16px;}
  .fl27-pill{display:inline-flex;align-items:center;gap:4px;font-size:11px;font-weight:800;padding:2px 8px;border-radius:999px;white-space:nowrap;}
  .fl27-pill.red{background:var(--red-soft);color:var(--red);border:1px solid #f5c2c2;}
  .fl27-pill.amber{background:var(--amber-soft);color:var(--amber);border:1px solid #ffd8a8;}
  .fl27-pill.teal{background:var(--teal-soft);color:var(--teal);border:1px solid #b2dfdb;}

  /* Home Nav Tabs */
  .home-nav-tabs{display:inline-flex;gap:6px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:5px;margin-bottom:20px;box-shadow:0 2px 8px rgba(0,0,0,0.03);flex-wrap:wrap;}
  .home-tab-btn{display:inline-flex;align-items:center;gap:8px;padding:9px 18px;border-radius:10px;border:none;background:transparent;color:var(--ink-soft);font-size:13.5px;font-weight:700;cursor:pointer;transition:all 0.15s ease;font-family:inherit;}
  .home-tab-btn:hover{color:var(--ink);background:var(--surface-2);}
  .home-tab-btn.active{background:var(--primary);color:#fff;box-shadow:0 2px 8px rgba(52,87,213,0.3);}
  .home-tab-btn svg.ic{width:16px;height:16px;}

  /* Timetable Schedule Styles */
  .schedule-container{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:20px;box-shadow:var(--shadow);margin-bottom:24px;}
  .schedule-header{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:12px;margin-bottom:16px;}
  .schedule-title-wrap{display:flex;align-items:center;gap:10px;flex-wrap:wrap;}
  .schedule-title{font-size:17px;font-weight:800;color:var(--ink);display:flex;align-items:center;gap:8px;}
  .schedule-badge{font-size:11.5px;font-weight:800;background:var(--primary-soft);color:var(--primary);padding:3px 10px;border-radius:999px;}
  .schedule-badge.hours{background:#ecfdf5;color:#065f46;border:1px solid #a7f3d0;}
  .schedule-actions{display:flex;gap:8px;align-items:center;flex-wrap:wrap;}

  .today-timeline-banner{background:linear-gradient(135deg,#eff6ff,#f8fafc);border:1px solid #bfdbfe;border-radius:12px;padding:12px 16px;margin-bottom:16px;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:10px;}
  .today-timeline-items{display:flex;gap:8px;align-items:center;flex-wrap:wrap;}
  .timeline-chip{display:inline-flex;align-items:center;gap:6px;background:#fff;border:1px solid #cbd5e1;padding:4px 10px;border-radius:8px;font-size:12px;font-weight:700;color:var(--ink);}
  .timeline-chip.active{background:var(--primary);color:#fff;border-color:var(--primary);box-shadow:0 0 0 3px rgba(52,87,213,0.2);}

  .schedule-table-wrap{overflow-x:auto;border-radius:10px;border:1px solid var(--line);background:#fff;}
  .schedule-table{width:100%;border-collapse:collapse;min-width:960px;font-size:12px;}
  .schedule-table th{background:#f8fafc;color:var(--ink-soft);font-weight:800;padding:10px 8px;text-align:center;border-bottom:2px solid var(--line);border-right:1px solid var(--line);font-size:12px;}
  .schedule-table th:first-child{min-width:110px;text-align:left;padding-left:14px;background:#f1f5f9;position:sticky;left:0;z-index:2;}
  .schedule-table th .period-num{font-size:13.5px;font-weight:900;color:var(--ink);display:block;}
  .schedule-table th .period-time{font-size:11px;font-weight:600;color:var(--ink-faint);display:block;margin-top:2px;}
  .schedule-table th .period-note{font-size:10px;font-weight:700;color:#c97a1f;background:#fef3c7;padding:1px 6px;border-radius:4px;display:inline-block;margin-top:3px;}

  .schedule-table td{padding:8px 6px;border-bottom:1px solid var(--line);border-right:1px solid var(--line);vertical-align:middle;text-align:center;height:72px;}
  .schedule-table td.day-cell{font-weight:800;font-size:13px;color:var(--ink);background:#f8fafc;text-align:left;padding-left:14px;position:sticky;left:0;z-index:1;border-right:2px solid var(--line);}
  .schedule-table tr.current-day td.day-cell{color:var(--primary);background:#eff6ff;}
  .schedule-table tr:hover td.day-cell{background:#eef2f6;}

  .slot-card{display:flex;flex-direction:column;align-items:center;justify-content:center;height:100%;min-height:56px;border-radius:8px;padding:6px 4px;cursor:pointer;transition:all 0.15s ease;user-select:none;position:relative;}
  .slot-card:hover{transform:translateY(-1px);box-shadow:0 3px 8px rgba(0,0,0,0.08);}
  .slot-card.empty{background:#fbfcfe;border:1px dashed #cbd5e1;color:var(--ink-faint);}
  .slot-card.empty:hover{background:#f1f5f9;border-color:var(--primary);color:var(--primary);}
  .slot-card.empty .empty-plus{font-size:14px;font-weight:700;}

  .slot-card.filled{border:1px solid #cbd5e1;}
  .slot-card .cls-name{font-size:13px;font-weight:900;line-height:1.2;}
  .slot-card .subj-name{font-size:10.5px;font-weight:700;margin-top:3px;padding:1px 6px;border-radius:4px;background:rgba(255,255,255,0.7);display:inline-block;}

  /* Colors per class */
  .slot-card.cls-09A, .slot-card.cls-9A{background:#eff6ff;border-color:#93c5fd;color:#1d4ed8;}

function sanitizeCell(val){
  if(typeof val === 'number') return val;
  if(val == null) return '';
  const s = String(val);
  if(/^[=+\-@\t\r]/.test(s)) return "'" + s;
  return s;
}

function todayStr(){ return new Date().toISOString().slice(0,10); }
function fmtDate(d){ if(!d) return null; const dt=new Date(d+'T00:00:00'); return dt.toLocaleDateString('tr-TR',{day:'2-digit',month:'2-digit',year:'numeric'}); }
function escapeHtml(str){ return String(str==null?'':str).replace(/[&<>"']/g, m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m])); }
function cleanTr(str){
  return String(str || '')
    .trim()
    .replace(/İ/g, 'I').replace(/ı/g, 'i')
    .replace(/Ğ/g, 'G').replace(/ğ/g, 'g')
    .replace(/Ü/g, 'U').replace(/ü/g, 'u')
    .replace(/Ş/g, 'S').replace(/ş/g, 's')
    .replace(/Ö/g, 'O').replace(/ö/g, 'o')
    .replace(/Ç/g, 'C').replace(/ç/g, 'c')
    .toUpperCase()
    .replace(/[^A-Z0-9\s]/g, ' ')
    .replace(/\s+/g, ' ')
    .trim();
}
function matchStudent(rawName, studentList){
  if(!rawName || !studentList || !studentList.length) return null;
  const cleanTarget = cleanTr(rawName);
  if(!cleanTarget) return null;
  const targetTokens = cleanTarget.split(' ').filter(Boolean);
  const targetTokenSet = new Set(targetTokens);

  // 1. Exact clean match
  for(const s of studentList){
    if(cleanTr(s.name) === cleanTarget) return s;
  }

  // 2. Exact word set match (handles Soyadı Adı vs Adı Soyadı reversal)
  for(const s of studentList){
    const sTokens = cleanTr(s.name).split(' ').filter(Boolean);
    if(sTokens.length === targetTokens.length && sTokens.every(t => targetTokenSet.has(t))){
      return s;
    }
  }

  // 3. Subset / multi-token match (handles middle names or names embedded with school/class text)
  let candidates = [];
  for(const s of studentList){
    const sTokens = cleanTr(s.name).split(' ').filter(Boolean);
    const sTokenSet = new Set(sTokens);
    const targetInS = targetTokens.length >= 2 && targetTokens.every(t => sTokenSet.has(t));
    const sInTarget = sTokens.length >= 2 && sTokens.every(t => targetTokenSet.has(t));
    if(targetInS || sInTarget){
      const matchCount = sTokens.filter(t => targetTokenSet.has(t)).length;
      candidates.push({ student: s, matchCount });
    }
  }
  if(candidates.length === 1) return candidates[0].student;
  if(candidates.length > 1){
    candidates.sort((a,b) => b.matchCount - a.matchCount);
    if(candidates[0].matchCount > candidates[1].matchCount){
      return candidates[0].student;
    }
  }

  return null;
}

function getExamCategory(label){

  if(/kds/i.test(clean)) return 'kds';
  if(/s[ıi]nav|yaz[ıi]l[ıi]/i.test(clean)) return 'sinav';

function extractExamNumber(label){
  const m = String(label || '').match(/(\d+)/);
  return m ? parseInt(m[1], 10) : 999;
}

function sortQuizzes(list){
  if(!Array.isArray(list)) return [];
  const catOrder = { 'quiz': 1, 'kds': 2, 'sinav': 3 };
  return [...list].sort((a, b) => {
    const catA = getExamCategory(a.label);
    const catB = getExamCategory(b.label);
    if(catOrder[catA] !== catOrder[catB]){
      return catOrder[catA] - catOrder[catB];
    }
    const numA = extractExamNumber(a.label);
    const numB = extractExamNumber(b.label);
    if(numA !== numB) return numA - numB;
    return (a.label || '').localeCompare(b.label || '', 'tr');
  });
}

      'feritcem@takip.local',
      'feritcem81@gmail.com',
      'ferit@takip.local',
      'feritcem@gmail.com'
    ];
  } else if(lowerUser === 'admin'){
    emailsToTry = ['admin@takip.local'];
  }

  let finalError = null;
  for(const email of emailsToTry){
    try {
      const { data, error } = await sb.auth.signInWithPassword({ email, password });

        return;

      if(error) finalError = error;

    }

async function downloadFullBackupJson(){
  if(!state.userId) return;
  try {
    showToast('Yedek hazırlanıyor...');
    const classIds = (state.classes || []).map(c=>c.id);
    const dump = {
      teacher_id: state.userId,
      teacher_username: state.username,
      teacher_email: state.userEmail,
      generated_at: new Date().toISOString(),
      classes: state.classes || []
    };

    if(classIds.length > 0){
      const byClassIds = async (table) => {
        const { data, error } = await sb.from(table).select('*').in('class_id', classIds);
        if(error) console.warn(table, error);
        return data || [];
      };
      const byStudentIds = async (table, studentIds) => {
        if(!studentIds.length) return [];
        const { data, error } = await sb.from(table).select('*').in('student_id', studentIds);
        if(error) console.warn(table, error);
        return data || [];
      };

      dump.students = await byClassIds('students');
      const studentIds = dump.students.map(s => s.id);

      dump.homeworks = await byClassIds('homeworks');
      dump.homework_status = await byStudentIds('homework_status', studentIds);

      dump.quizzes = await byClassIds('quizzes');
      dump.quiz_scores = await byStudentIds('quiz_scores', studentIds);

      dump.performance_tasks = await byClassIds('performance_tasks');
      dump.rubrics = await byClassIds('rubrics');
      dump.rubric_scores = await byStudentIds('rubric_scores', studentIds);

      dump.deneme_exams = await byClassIds('deneme_exams');
      const examIds = dump.deneme_exams.map(e => e.id);
      if(examIds.length){
        const { data: dScores } = await sb.from('deneme_scores').select('*').in('exam_id', examIds);
        dump.deneme_scores = dScores || [];
      } else {
        dump.deneme_scores = [];
      }

      dump.counseling_notes = await byStudentIds('counseling_notes', studentIds);
      dump.university_goals = await byStudentIds('university_goals', studentIds);
      dump.abroad_consulting = await byStudentIds('abroad_consulting', studentIds);
      dump.class_evaluations = await byClassIds('class_evaluations');
      dump.class_evaluation_marks = await byStudentIds('class_evaluation_marks', studentIds);
    } else {
      dump.students = [];
      dump.homeworks = [];
      dump.homework_status = [];
      dump.quizzes = [];
      dump.quiz_scores = [];
      dump.performance_tasks = [];
      dump.rubrics = [];
      dump.rubric_scores = [];
      dump.deneme_exams = [];
      dump.deneme_scores = [];
      dump.counseling_notes = [];
      dump.university_goals = [];
      dump.abroad_consulting = [];
      dump.class_evaluations = [];
      dump.class_evaluation_marks = [];
    }

    dump.weekly_schedule = getTeacherSchedule();
    dump.teacher_schedule_image = getTeacherScheduleImage();
    dump.calendar_events = getCalendarEvents();

    const jsonStr = JSON.stringify(dump, null, 2);
    const blob = new Blob([jsonStr], { type: 'application/json;charset=utf-8' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    const d = new Date();
    const pad = n => String(n).padStart(2, '0');
    const dateStr = d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()) + '_' + pad(d.getHours()) + '-' + pad(d.getMinutes());
    a.href = url;
    a.download = `${(state.username || 'ogretmen').replace(/[^a-zA-Z0-9_\u00C0-\u017F]/g, '_')}_yedek_${dateStr}.json`;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(url);
    showToast('Tam sistem yedeği indirildi');
  } catch(err) {
    console.error('Yedek indirme hatası:', err);
    alert('Yedek indirilemedi: ' + (err.message || err));
  }
}

async function restoreBackupFromFile(file){
  try {
    const text = await file.text();
    const data = JSON.parse(text);
    if(!data || (!Array.isArray(data.classes) && !Array.isArray(data.students))){
      alert('Seçilen dosya geçerli bir sistem yedek dosyası (.json) değil.');
      return;
    }
    const clsCount = (data.classes || []).length;
    const stuCount = (data.students || []).length;
    const hwCount = (data.homeworks || []).length;
    const perfCount = (data.performance_tasks || []).length;
    const quizCount = (data.quizzes || []).length;

    const teacherInfo = data.teacher_username || data.teacher_email || 'Öğretmen';
    const dateInfo = data.generated_at ? new Date(data.generated_at).toLocaleString('tr-TR') : 'Bilinmeyen Tarih';

    const confirmMsg = '📦 YEDEK GERİ YÜKLEME ONAYI\n\n' +
      'Yedek Sahibi: ' + teacherInfo + '\n' +
      'Yedek Tarihi: ' + dateInfo + '\n' +
      'İçerik:\n' +
      '• ' + clsCount + ' Sınıf\n' +
      '• ' + stuCount + ' Öğrenci\n' +
      '• ' + hwCount + ' Ödev Tanımı\n' +
      '• ' + perfCount + ' Performans Görevi\n' +
      '• ' + quizCount + ' KDS Sınavı\n\n' +
      '⚠️ DİKKAT: Bu işlem yedekteki verileri veritabanınıza geri yükleyecektir.\n' +
      'Devam etmek istiyor musunuz?';

    if(!confirm(confirmMsg)) return;

    showToast('Yedek geri yükleniyor, lütfen bekleyin...');

    // 1. Sınıflar
    if(data.classes && data.classes.length > 0){
      const classesToUpsert = data.classes.map(c => ({
        ...c,
        owner_id: state.isAdmin ? (c.owner_id || state.userId) : state.userId
      }));
      const { error } = await sb.from('classes').upsert(classesToUpsert, { onConflict: 'id' });
      if(error) throw new Error('Sınıflar yüklenemedi: ' + error.message);
    }

    // 2. Öğrenciler
    if(data.students && data.students.length > 0){
      const { error } = await sb.from('students').upsert(data.students, { onConflict: 'id' });
      if(error) throw new Error('Öğrenciler yüklenemedi: ' + error.message);
    }

    // 3. Ödevler ve Durumlar
    if(data.homeworks && data.homeworks.length > 0){
      const { error } = await sb.from('homeworks').upsert(data.homeworks, { onConflict: 'class_id,slot_no' });
      if(error) console.warn('homeworks restore:', error);
    }
    if(data.homework_status && data.homework_status.length > 0){
      const { error } = await sb.from('homework_status').upsert(data.homework_status, { onConflict: 'student_id,slot_no' });
      if(error) console.warn('homework_status restore:', error);
    }

    // 4. KDS Sınavları ve Notları
    if(data.quizzes && data.quizzes.length > 0){
      const { error } = await sb.from('quizzes').upsert(data.quizzes, { onConflict: 'class_id,slot_no' });
      if(error) console.warn('quizzes restore:', error);
    }
    if(data.quiz_scores && data.quiz_scores.length > 0){
      const { error } = await sb.from('quiz_scores').upsert(data.quiz_scores, { onConflict: 'student_id,slot_no' });
      if(error) console.warn('quiz_scores restore:', error);
    }

    // 5. Performans Görevleri, Rubrikler ve Notları
    if(data.performance_tasks && data.performance_tasks.length > 0){
      const { error } = await sb.from('performance_tasks').upsert(data.performance_tasks, { onConflict: 'class_id,slot_no' });
      if(error) console.warn('performance_tasks restore:', error);
    }
    if(data.rubrics && data.rubrics.length > 0){
      const { error } = await sb.from('rubrics').upsert(data.rubrics, { onConflict: 'class_id,level' });
      if(error) console.warn('rubrics restore:', error);
    }

  }
}

const SCHOOL_ROSTER_CATALOG_KEY = 'takev_school_roster_catalog';

function normalizeClassName(raw){
  if(!raw) return '';
  let s = String(raw).trim().toUpperCase();
  s = s.replace(/^(SINIF|ŞUBE|GRADE|CLASS)\s*[:\-\/]?\s*/i, '');
  s = s.replace(/[\/_\s]+/g, '-').replace(/--+/g, '-');
  const m = s.match(/^(\d{1,2})([A-ZÇĞİÖŞÜ]+)$/i);
  if(m){
    s = m[1] + '-' + m[2];
  }
  s = s.replace(/^HZ\b/i, 'Hz');
  return s;
}

function getSchoolRosterCatalog(){
  try{
    const raw = localStorage.getItem(SCHOOL_ROSTER_CATALOG_KEY);
    if(raw) return JSON.parse(raw);
  }catch(e){}
  return {};
}

function parseSchoolRosterExcel(buffer){
  if(typeof XLSX === 'undefined'){
    throw new Error('Excel kütüphanesi (XLSX) yüklenemedi.');
  }
  const wb = XLSX.read(buffer, { type: 'array' });
  const catalog = {};
  let totalStudents = 0;

  wb.SheetNames.forEach(sheetName => {
    const ws = wb.Sheets[sheetName];
    if(!ws) return;
    const rows = XLSX.utils.sheet_to_json(ws, { header: 1, defval: '' });
    if(!rows || rows.length < 2) return;

    let sheetClass = '';
    const cleanSheet = sheetName.trim();
    if(/\b(9|10|11|12|HZ|HAZIRLIK)[-/\s]?[A-ZÇĞİÖŞÜ]/i.test(cleanSheet)){
      sheetClass = normalizeClassName(cleanSheet);
    }

    let headerIdx = -1;
    let colClass = -1, colNo = -1, colName = -1, colFirstName = -1, colLastName = -1;

    for(let r = 0; r < Math.min(rows.length, 15); r++){
      const row = rows[r];
      if(!Array.isArray(row)) continue;

      let cClass = -1, cNo = -1, cName = -1, cFirst = -1, cLast = -1;
      let titleClassFound = '';

      for(let c = 0; c < row.length; c++){
        const cellRaw = String(row[c] || '').trim();
        const val = cellRaw.toLowerCase();

        const titleMatch = cellRaw.match(/(?:s[ıi]n[ıi]f|[şs]ube)\s*[:\-]\s*(\d{1,2}[-/\s]?[a-zçğıöşü]+|hz[-/\s]?[a-zçğıöşü]+)/i);
        if(titleMatch && !titleClassFound){
          titleClassFound = normalizeClassName(titleMatch[1]);
        }

        if(cClass === -1 && /(^s[ıi]n[ıi]f$|^s[ıi]n[ıi]f[ıi]$|^[şs]ube$|^[şs]ube[sy]i$|s[ıi]n[ıi]f.*[şs]ube|class|grade)/i.test(val)){
          cClass = c;
        }
        if(cNo === -1 && /(^no$|^no\.$|^numara$|^okul\s*no$|^öğrenci\s*no$|^ogr\s*no$|^number$)/i.test(val)){
          cNo = c;
        }
        if(cName === -1 && /(ad[ıi]?\s*soyad[ıi]?|öğrenci\s*ad[ıi]?|full\s*name)/i.test(val)){
          cName = c;
        }
        if(cFirst === -1 && /(^ad[ıi]$|^adı$|^öğrenci\s*adı$|^first\s*name$|^isim$)/i.test(val)){
          cFirst = c;
        }
        if(cLast === -1 && /(^soyad[ıi]$|^soyadı$|^last\s*name$)/i.test(val)){
          cLast = c;
        }
      }

      if(titleClassFound && !sheetClass){
        sheetClass = titleClassFound;
      }

      const hasName = (cName !== -1) || (cFirst !== -1);
      const hasClassOrSheet = (cClass !== -1) || sheetClass;

      if(hasName && hasClassOrSheet){
        headerIdx = r;
        colClass = cClass;
        colNo = cNo;
        colName = cName;
        colFirstName = cFirst;
        colLastName = cLast;
        break;
      }
    }

    if(headerIdx === -1){
      if(sheetClass){
        colClass = -1;
        colNo = 0;
        colName = 1;
        headerIdx = 0;
      } else {
        colClass = 0;
        colNo = 1;
        colName = 2;
        headerIdx = 0;
      }
    }

    for(let r = headerIdx + 1; r < rows.length; r++){
      const row = rows[r];
      if(!Array.isArray(row) || !row.length) continue;

      let clsRaw = (colClass !== -1 ? String(row[colClass] || '') : '').trim();
      if(!clsRaw && sheetClass) clsRaw = sheetClass;

      let noRaw = (colNo !== -1 ? String(row[colNo] || '') : '').trim();
      let nameRaw = (colName !== -1 ? String(row[colName] || '') : '').trim();

      if(!nameRaw && colFirstName !== -1){
        const f = String(row[colFirstName] || '').trim();
        const l = (colLastName !== -1 ? String(row[colLastName] || '') : '').trim();
        nameRaw = (f + ' ' + l).trim();
      }

      if(!clsRaw || !nameRaw) continue;
      if(/ad[ıi]?\s*soyad[ıi]?/i.test(nameRaw) || /s[ıi]n[ıi]f/i.test(clsRaw)) continue;

      let cls = normalizeClassName(clsRaw);
      if(noRaw.endsWith('.0')) noRaw = noRaw.replace(/\.0$/, '');

      catalog[cls] = catalog[cls] || [];
      if(!catalog[cls].some(s => s.name.toLowerCase() === nameRaw.toLowerCase() && (s.no === noRaw || !noRaw))){
        catalog[cls].push({
          no: noRaw || '',
          name: nameRaw
        });
        totalStudents++;
      }
    }
  });

  Object.keys(catalog).forEach(cls => {
    catalog[cls].sort((a, b) => {
      const na = parseInt(a.no, 10);
      const nb = parseInt(b.no, 10);
      if(!isNaN(na) && !isNaN(nb)) return na - nb;
      return a.name.localeCompare(b.name, 'tr');
    });
  });

  return {
    catalog,
    classCount: Object.keys(catalog).length,
    studentCount: totalStudents,
    classList: Object.keys(catalog).sort((a, b) => a.localeCompare(b, 'tr', { numeric: true }))
  };
}

async function loadClasses(){
  if(!state.userId) return;
  let query = sb.from('classes').select('*').order('sort_order');
  if(!state.isAdmin){
    query = query.eq('owner_id', state.userId);
  }
  const { data, error } = await query;
  if(error){
    console.error('loadClasses error', error);
    if(state.isAdmin){
      showToast('Sınıflar yüklenemedi: ' + error.message);
    }
  }
  const localMap = getLocalCounselorMap();
  let list = (data || []).map(c=>{
    if(c.is_counselor === undefined && localMap[c.id] !== undefined){
      c.is_counselor = localMap[c.id];
    }
    return c;
  });
  if(state.isAdmin){
    list = sortClassesList(list);
  }
  state.classes = list;
}

async function addClass(name, isCounselorVal = false, targetOwnerId = null, targetTeacherName = ''){
  name = name.trim();
  if(!name){ showToast('Sınıf adı girilmeli'); return; }

  const ownerId = (state.isAdmin && targetOwnerId) ? targetOwnerId : state.userId;
  if(!ownerId){ showToast('Kullanıcı kimliği bulunamadı'); return; }

  // Bu sınıftan bu öğretmende zaten var mı?
  const existingForOwner = state.classes.some(c => (c.owner_id === ownerId || (!state.isAdmin)) && normalizeClassName(c.name) === normalizeClassName(name));
  if(existingForOwner){
    showToast('Bu sınıf ' + (state.isAdmin ? 'seçilen öğretmenin hesabında' : 'listenizde') + ' zaten var');
    return;
  }

  const catalog = getSchoolRosterCatalog();
  const matchedKey = Object.keys(catalog).find(k => normalizeClassName(k) === normalizeClassName(name));
  const stus = (matchedKey && catalog[matchedKey]) ? catalog[matchedKey] : [];

  const stuPayload = stus.map((s, idx) => ({
    name: s.name,
    no: s.no || null,
    sort_order: idx + 1
  }));

  let newClass = null;
  const saveBtn = document.getElementById('mSave');
  if(saveBtn){ saveBtn.disabled = true; saveBtn.textContent = 'Oluşturuluyor...'; }

  // 1. Önce RPC fonksiyonunu dene (SECURITY DEFINER ile admin ve öğretmenler için en güvenli ve tam yetkili yöntem)
  try {
    const { data: rpcData, error: rpcErr } = await sb.rpc('create_class_for_teacher', {
      p_name: name,
      p_owner_id: ownerId,
      p_is_counselor: isCounselorVal,
      p_students: stuPayload
    });
    if(!rpcErr && rpcData && rpcData.success){
      newClass = {
        id: rpcData.class_id,
        name: name,
        owner_id: ownerId,
        is_counselor: isCounselorVal,
        sort_order: 999
      };
      newClass.students = stuPayload.map((s, idx) => ({ ...s, id: 'stu_' + (idx + 1), class_id: newClass.id }));
    } else if(rpcErr && !rpcErr.message?.includes('Could not find the function')){
      console.warn('RPC create_class_for_teacher hatası:', rpcErr);
    }
  } catch(e){
    console.warn('RPC çağrısı yakalandı:', e);
  }

  // 2. RPC bulunamadıysa doğrudan Supabase insert ile dene
  if(!newClass){
    const maxOrder = Math.max(-1, ...state.classes.map(c=>c.sort_order||0));
    const insertPayload = {
      name,
      sort_order: maxOrder + 1,
      owner_id: ownerId,
      is_counselor: isCounselorVal
    };

    let { data, error } = await sb.from('classes').insert(insertPayload).select();

    if(error){
      if(error.message && error.message.includes('is_counselor')){
        delete insertPayload.is_counselor;
        const retryRes = await sb.from('classes').insert(insertPayload).select();
        if(!retryRes.error && retryRes.data && retryRes.data[0]){
          newClass = retryRes.data[0];
        } else {
          error = retryRes.error;
        }
      }
    } else if(data && data[0]){
      newClass = data[0];
    }

    if(!newClass && error){
      if(saveBtn){ saveBtn.disabled = false; saveBtn.textContent = 'Sınıfı Oluştur'; }
      if(state.isAdmin && (error.code === '42501' || error.message?.includes('violates row-level security policy'))){
        openSqlNoticeModal('sql/admin_quick_class_assign.sql');
        return;
      }
      showToast('Sınıf eklenemedi: ' + error.message);
      return;
    }

    // Doğrudan insert başarılı olduysa ve katalogda öğrenci varsa öğrencileri aktar
    if(newClass && stus.length){
      const stuRows = stus.map((s, idx) => ({
        class_id: newClass.id,
        name: s.name,
        no: s.no || null,
        sort_order: idx + 1
      }));
      try {
        const { data: insertedStus, error: insErr } = await sb.from('students').insert(stuRows).select();
        newClass.students = (!insErr && insertedStus) ? insertedStus : stuRows;
      } catch(e){
        newClass.students = stuRows;
      }
    }
  }

  if(newClass){
    newClass.is_counselor = isCounselorVal;
    saveLocalCounselor(newClass.id, isCounselorVal);
    state.classes.push(newClass);

    closeModal();
    logActivity('"' + name + '" sınıfını oluşturdu' + (state.isAdmin ? ' (' + targetTeacherName + ')' : ''));

    if(stus.length){
      showToast('✅ "' + name + '" sınıfı ' + (state.isAdmin ? targetTeacherName + ' hesabına tanımlandı' : 'oluşturuldu') + ' ve ' + stus.length + ' öğrenci tek tıkla aktarıldı!');
    } else {
      showToast('✅ "' + name + '" sınıfı ' + (state.isAdmin ? targetTeacherName + ' hesabına tanımlandı' : 'oluşturuldu') + '!');
    }

    if(state.isAdmin){
      render();
    } else {
      state.page='sinif_detail'; state.classId=newClass.id; state.view='roster';
      await loadClassDetail(state.classId);
    }
  }
}
async function toggleCounselorRole(){
  const cls = state.cls;
  if(!cls || state.isAdmin) return;
  const current = isCounselor(cls);
  const nextVal = !current;
  cls.is_counselor = nextVal;
  saveLocalCounselor(cls.id, nextVal);
  try{
    await sb.from('classes').update({ is_counselor: nextVal }).eq('id', cls.id);
  }catch(e){}
  const cInList = state.classes.find(x=>x.id===cls.id);
  if(cInList) cInList.is_counselor = nextVal;
  showToast(nextVal ? 'Danışmanlık rolü aktif edildi' : 'Danışmanlık rolü kapatıldı');
  logActivity(cls.name + ' danışmanlık durumunu ' + (nextVal?'aktif':'pasif') + ' yaptı');
  render();
}
async function renameClass(newName){
  if(state.isAdmin){ showToast('Yönetici modunda sınıf düzenlenemez (Salt Okunur).'); return; }
  newName = newName.trim();
  if(!newName) return;
  await sb.from('classes').update({name:newName}).eq('id', state.cls.id);
  const c = state.classes.find(x=>x.id===state.cls.id);
  if(c) c.name = newName;
  logActivity('Sınıf adını "'+newName+'" olarak değiştirdi');
  state.cls.name = newName;
  render();
  showToast('Sınıf adı güncellendi');
}
async function deleteClass(){
  if(state.isAdmin){ showToast('Yönetici modunda sınıf silinemez (Salt Okunur).'); return; }
  const name = state.cls.name;
  await sb.from('classes').delete().eq('id', state.cls.id);
  state.classes = state.classes.filter(c=>c.id!==state.cls.id);
  logActivity('"'+name+'" sınıfını sildi');
  state.page='home'; state.cls=null; state.classId=null;
  render();
  showToast('Sınıf silindi');
}

function autoWidth(rows){
  if(!rows || !rows.length) return [];
  const keys = Object.keys(rows[0]);
  return keys.map(k=>{
    let maxLen = k.length;
    rows.forEach(r=>{ const len = String(r[k]??'').length; if(len>maxLen) maxLen=len; });
    return { wch: Math.min(Math.max(maxLen+2, 8), 42) };
  });
}
function addSheet(wb, rows, sheetName){
  if(!rows || !rows.length) return;
  const safeRows = rows.map(r=>{
    const clean = {};
    for(const k of Object.keys(r)){ clean[k] = sanitizeCell(r[k]); }
    return clean;
  });
  const ws = XLSX.utils.json_to_sheet(safeRows);
  ws['!cols'] = autoWidth(safeRows);
  XLSX.utils.book_append_sheet(wb, ws, sheetName);
}

    form3Merges.push({ s: { r: 18, c: startCol }, e: { r: 18, c: startCol + 3 } });
  });

  const wsForm3 = XLSX.utils.aoa_to_sheet(form3Aoa);
  wsForm3['!merges'] = form3Merges;
  const form3Cols = [];
  sorted.forEach(()=>{ form3Cols.push({ wch: 6 }, { wch: 22 }, { wch: 14 }, { wch: 14 }, { wch: 4 }, { wch: 4 }); });
  wsForm3['!cols'] = form3Cols;
  XLSX.utils.book_append_sheet(wb, wsForm3, 'Form-3a');

  // 3. Form-4 (Öğrenci Sınıf Durum Değerlendirmesi)
  const periods = [
    { title: '(Eylül-Kasım Arası Değerlendirme)' },
    { title: '(I.Dönem Sonu Arası Değerlendirme)' },
    { title: '(II. Dönem Başı-Nisan Arası Değerlendirme)' }
  ];
  const criteriaList = [
    'Derslerde çok aktif olan öğrenciler',
    'Derslerde pasif olan öğrenciler',
    'Derslerin akışını bozan öğrenciler',
    'Konsantrasyon yetersizliği olan öğrenciler',
    'Aşırı Sınav Kaygısı yaşayan öğrenciler',
    'Derslere düzenli çalışan öğrenciler',
    'Rehberlik görüşmesi gereken öğr.'
  ];

  const totalForm4Rows = 10 + sorted.length;
  const form4Aoa = Array.from({ length: totalForm4Rows }, () => []);
  const form4Merges = [];

  periods.forEach((p, pIdx)=>{
    const pStartCol = pIdx * 13;
    form4Aoa[0][pStartCol] = 'ÖZEL TAKEV Anadolu ve Fen Lisesi';
    form4Aoa[0][pStartCol + 10] = 'Form-4';
    form4Merges.push({ s: { r: 0, c: pStartCol }, e: { r: 1, c: pStartCol + 9 } });

    form4Aoa[3][pStartCol] = 'ÖĞRENCİ SINIF DURUM DEĞERLENDİRMESİ';
    form4Merges.push({ s: { r: 3, c: pStartCol }, e: { r: 3, c: pStartCol + 10 } });

    form4Aoa[4][pStartCol] = p.title;
    form4Merges.push({ s: { r: 4, c: pStartCol }, e: { r: 4, c: pStartCol + 10 } });

    form4Aoa[6][pStartCol + 3] = 'Tüm dersler düzeyinde GENEL DEĞERLENDİRME';
    form4Merges.push({ s: { r: 6, c: pStartCol + 3 }, e: { r: 6, c: pStartCol + 9 } });

    form4Aoa[7][pStartCol] = 'Sıra';
    form4Aoa[7][pStartCol + 1] = 'Okul No';
    form4Aoa[7][pStartCol + 2] = 'Adı Soyadı';
    criteriaList.forEach((crit, cIdx)=>{ form4Aoa[7][pStartCol + 3 + cIdx] = crit; });
    form4Aoa[7][pStartCol + 10] = 'ÖZEL NOTLAR';

    const dbEval = (cls.classEvaluations||[]).find(e=> e.period && (e.period.includes(p.title.replace(/[()]/g,'')) || p.title.includes(e.period)));

    sorted.forEach((s, sIdx)=>{
      const rowIdx = 8 + sIdx;
      form4Aoa[rowIdx][pStartCol] = sIdx + 1;
      form4Aoa[rowIdx][pStartCol + 1] = parseInt(s.no) || s.no || '';
      form4Aoa[rowIdx][pStartCol + 2] = s.name;

      const marks = dbEval ? ((cls.classEvaluationMarks[dbEval.id]||{})[s.id]||{}) : {};
      criteriaList.forEach((_, cIdx)=>{
        const isChecked = marks[cIdx] && marks[cIdx].checked;
        form4Aoa[rowIdx][pStartCol + 3 + cIdx] = isChecked ? '☑' : '☐';
      });
      form4Aoa[rowIdx][pStartCol + 10] = (marks[-1] && marks[-1].note) || '';
    });
  });

  const wsForm4 = XLSX.utils.aoa_to_sheet(form4Aoa);
  wsForm4['!merges'] = form4Merges;
  const form4Cols = [];
  periods.forEach(()=>{
    form4Cols.push(
      { wch: 6 }, { wch: 10 }, { wch: 24 },
      { wch: 12 }, { wch: 12 }, { wch: 12 }, { wch: 12 }, { wch: 12 }, { wch: 12 }, { wch: 12 },
      { wch: 20 },
      { wch: 4 }, { wch: 4 }
    );
  });
  wsForm4['!cols'] = form4Cols;
  XLSX.utils.book_append_sheet(wb, wsForm4, 'Form-4');

  // 4. Tab: FL-27 (Ödev Teslim Etmeme / Yapmama Bildirim Formu)
  const fl27Aoa = [];
  fl27Aoa.push(['ÖZEL TAKEV Anadolu ve Fen Lisesi', '', '', '', '', '', 'FL-27']);
  fl27Aoa.push(['']);
  fl27Aoa.push(['ÖDEV TESLİM ETMEME / YAPMAMA BİLDİRİM ÇİZELGESİ (FL-27)']);
  fl27Aoa.push(['Kural: Teslim edilmeyen her 3 ödev için 1 adet FL-27 formu düzenlenir.']);
  fl27Aoa.push(['']);
  fl27Aoa.push(['# Sıra', '# Okul No', 'Adı Soyadı', 'Toplam Kontrol Edilen', 'Yapılan Ödev', 'Yapılmayan Ödev', 'FL-27 Sayısı (Her 3 Ödeve 1)', 'Yapılmayan Ödev Konuları', 'Durum Açıklaması']);
  
  const aCount = assignedCount();
  sorted.forEach((s, idx)=>{
    const c = completedCount(s.id);
    const m = missedCount(s.id);
    const fl = fl27Count(s.id);
    const mTopics = missedHomeworks(s.id).map(h=> (h.topic || ('Ödev #' + h.slot_no)) + (h.check_date ? ' (' + fmtDate(h.check_date) + ')' : '')).join(', ');
    let durum = 'Temiz';
    if(fl > 0) durum = fl + ' Adet FL-27 Formu Düzenlendi';
    else if(m === 2) durum = 'FL-27 Sınırında (2 Eksik)';
    else if(m === 1) durum = '1 Eksik Ödev';
    fl27Aoa.push([
      idx + 1,
      parseInt(s.no) || s.no || '',
      s.name,
      aCount,
      c,
      m,
      fl,
      mTopics,
      durum
    ]);
  });

  const wsFl27 = XLSX.utils.aoa_to_sheet(fl27Aoa);
  wsFl27['!merges'] = [
    { s: { r: 0, c: 0 }, e: { r: 1, c: 5 } },
    { s: { r: 2, c: 0 }, e: { r: 2, c: 8 } },
    { s: { r: 3, c: 0 }, e: { r: 3, c: 8 } }
  ];
  wsFl27['!cols'] = [
    { wch: 8 },  // Sıra
    { wch: 12 }, // Okul No
    { wch: 28 }, // Adı Soyadı
    { wch: 22 }, // Toplam Kontrol Edilen
    { wch: 16 }, // Yapılan Ödev
    { wch: 18 }, // Yapılmayan Ödev
    { wch: 26 }, // FL-27 Sayısı
    { wch: 45 }, // Konular
    { wch: 32 }  // Durum
  ];
  XLSX.utils.book_append_sheet(wb, wsFl27, 'FL-27');

  const safeName = (cls.name||'Sinif').replace(/[^a-zA-Z0-9_\u00C0-\u017F-]/g, '_');
  XLSX.writeFile(wb, safeName + '_TAKEV_Rehberlik_Formlari.xlsx');
  showToast('TAKEV Rehberlik ve FL-27 Formları (Excel) indirildi');
}

function exportFl27Excel(){
  const cls = state.cls;
  if(!cls || !cls.students.length){ showToast('Sınıfta öğrenci yok.'); return; }
  const sorted = sortedStudents();
  const aCount = assignedCount();
  const rows = sorted.map((s, idx)=>{
    const c = completedCount(s.id);
    const m = missedCount(s.id);
    const fl = fl27Count(s.id);
    const mTopics = missedHomeworks(s.id).map(h=> (h.topic || ('Ödev #' + h.slot_no)) + (h.check_date ? ' (' + fmtDate(h.check_date) + ')' : '')).join(', ');
    let durum = 'Temiz';
    if(fl > 0) durum = fl + ' Adet FL-27 Hak Edildi';
    else if(m === 2) durum = 'FL-27 Sınırında (2 Eksik)';
    else if(m === 1) durum = '1 Eksik Ödev';
    return {
      'Sıra': idx + 1,
      'Okul No': s.no || '',
      'Adı Soyadı': s.name,
      'Kontrol Edilen Ödev': aCount,
      'Yapılan Ödev': c,
      'Yapılmayan Ödev': m,
      'FL-27 Sayısı (Her 3 Ödeve 1)': fl,
      'Teslim Edilmeyen Ödevler': mTopics || 'Yok',
      'Durum Açıklaması': durum
    };
  });
  const wb = XLSX.utils.book_new();
  addSheet(wb, rows, 'FL-27 Ödev Takip');
  const safeName = (cls.name||'Sinif').replace(/[^a-zA-Z0-9_\u00C0-\u017F-]/g, '_');
  XLSX.writeFile(wb, safeName + '_FL27_Odev_Takip_' + todayStr() + '.xlsx');
  showToast('FL-27 Ödev Takip Listesi indirildi');
}

function openFl27Modal(){
  const cls = state.cls;
  if(!cls || !cls.students.length){ showToast('Sınıfta öğrenci yok'); return; }
  const sorted = sortedStudents();
  const aCount = assignedCount();
  const totalFl = totalClassFl27();

  const flStudents = sorted.filter(s => fl27Count(s.id) > 0);
  const atRiskStudents = sorted.filter(s => missedCount(s.id) === 2);

  const renderRows = (filterOnlyAlerts = false)=>{
    const list = sorted.filter(s => {
      if(!filterOnlyAlerts) return true;
      return fl27Count(s.id) > 0 || missedCount(s.id) === 2;
    });

    if(!list.length){
      return '<div class="empty" style="padding:24px 10px;">FL-27 uyarısı veya sınırda olan öğrenci bulunmuyor.</div>';
    }

    return list.map((s, idx)=>{
      const m = missedCount(s.id);
      const fl = fl27Count(s.id);
      const mHws = missedHomeworks(s.id);
      const hwChips = mHws.map(h=>
        '<span style="display:inline-block;font-size:11px;background:var(--surface-2);color:var(--ink-soft);padding:1px 6px;border-radius:4px;margin:2px 3px 2px 0;">#' + h.slot_no + ' ' + escapeHtml(h.topic || 'Ödev') + '</span>'
      ).join('');

      let badgeHtml = '';
      if(fl > 0){
        badgeHtml = '<span class="fl27-pill red">⚠️ ' + fl + 'x FL-27</span>';
      } else if(m === 2){
        badgeHtml = '<span class="fl27-pill amber">⚠️ 2 Eksik (Sınırda)</span>';
      } else if(m === 1){
        badgeHtml = '<span class="fl27-pill" style="background:var(--surface-2);color:var(--ink-soft);">1 Eksik</span>';
      } else {
        badgeHtml = '<span class="fl27-pill teal">Temiz</span>';
      }

      return '<div style="display:flex;align-items:center;gap:10px;padding:11px 8px;border-bottom:1px solid var(--line);flex-wrap:wrap;">' +
        '<div style="width:36px;font-size:12px;font-weight:700;color:var(--primary);text-align:center;">#' + escapeHtml(s.no || '—') + '</div>' +
        '<div style="flex:1;min-width:140px;">' +
          '<div style="font-size:13.5px;font-weight:700;display:flex;align-items:center;gap:6px;flex-wrap:wrap;">' +
            escapeHtml(s.name) + badgeHtml +
          '</div>' +
          '<div style="font-size:11.5px;color:var(--ink-soft);margin-top:3px;">' +
            'Yapılmayan: <b>' + m + '</b> / ' + aCount + ' ödev' +
            (m > 0 ? (' &middot; ' + hwChips) : '') +
          '</div>' +
        '</div>' +
        '<div style="display:flex;gap:6px;align-items:center;">' +
          (fl > 0 ? ('<button class="btn btn-danger btn-sm" data-flview="' + s.id + '" style="font-size:11.5px;padding:5px 9px;">' + ic('file') + 'FL-27 Formu</button>') : '') +
        '</div>' +
      '</div>';
    }).join('');
  };

  const modalHtml =
    '<div>' +
      '<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;">' +
        '<div>' +
          '<h3 style="margin-bottom:2px;">FL-27 Ödev Takip Listesi</h3>' +
          '<div style="font-size:12.5px;color:var(--ink-soft);">' + escapeHtml(cls.name) + ' &middot; Toplam <b>' + totalFl + ' adet FL-27</b> düzenlendi</div>' +
        '</div>' +
        '<div style="width:38px;height:38px;border-radius:10px;background:var(--amber-soft);color:var(--amber);display:flex;align-items:center;justify-content:center;font-weight:900;font-size:16px;">FL</div>' +
      '</div>' +

      '<div class="fl27-banner" style="padding:10px 14px;margin-bottom:14px;font-size:12.5px;color:#7a4100;line-height:1.45;">' +
        '<b>📋 Okul Kuralı:</b> Kontrol tarihi geçmiş teslim edilmeyen <b>her 3 ödev için 1 adet FL-27 formu</b> düzenlenir. (Örn: 3 ödev = 1 FL-27, 6 ödev = 2 FL-27).' +
      '</div>' +

      '<div style="display:flex;gap:6px;margin-bottom:12px;">' +
        '<button class="btn btn-sm btn-primary" id="flTabAlerts" style="padding:6px 12px;">Yalnızca Uyarılar (' + (flStudents.length + atRiskStudents.length) + ')</button>' +
        '<button class="btn btn-sm btn-outline" id="flTabAll" style="padding:6px 12px;">Tüm Sınıf (' + sorted.length + ')</button>' +
      '</div>' +

      '<div id="flListContainer" style="max-height:50vh;overflow-y:auto;border:1px solid var(--line);border-radius:10px;padding:4px 8px;background:var(--surface);">' +
        renderRows(true) +
      '</div>' +

      '<div class="modalactions" style="margin-top:16px;flex-wrap:wrap;">' +
        '<button class="btn btn-outline" id="mCloseFl27List">Kapat</button>' +
        '<button class="btn btn-soft" id="mExportFl27Excel">' + ic('file') + 'Excel Çizelgesi İndir</button>' +
      '</div>' +
    '</div>';

  openModalHtml(modalHtml, '580px');

  let currentTabAlerts = true;
  const container = document.getElementById('flListContainer');
  const btnAlerts = document.getElementById('flTabAlerts');
  const btnAll = document.getElementById('flTabAll');

  const wireViewBtns = ()=>{
    container.querySelectorAll('[data-flview]').forEach(btn=>{
      btn.onclick = ()=>{
        openStudentFl27PrintModal(btn.dataset.flview);
      };
    });
  };
  wireViewBtns();

  btnAlerts.onclick = ()=>{
    currentTabAlerts = true;
    btnAlerts.className = 'btn btn-sm btn-primary';
    btnAll.className = 'btn btn-sm btn-outline';
    container.innerHTML = renderRows(true);
    wireViewBtns();
  };
  btnAll.onclick = ()=>{
    currentTabAlerts = false;
    btnAll.className = 'btn btn-sm btn-primary';
    btnAlerts.className = 'btn btn-sm btn-outline';
    container.innerHTML = renderRows(false);
    wireViewBtns();
  };

  document.getElementById('mCloseFl27List').onclick = closeModal;
  document.getElementById('mExportFl27Excel').onclick = exportFl27Excel;
}

      '<button class="btn btn-outline" id="mCancelF2">Kapat</button>' +
      (!state.isAdmin ? '<button class="btn btn-primary" id="mSaveF2">Tümünü Kaydet</button>' : '') +
    '</div>'
  );

  document.getElementById('mCancelF2').onclick = closeModal;
  const saveBtn = document.getElementById('mSaveF2');
  if(saveBtn){
    saveBtn.onclick = async ()=>{
      saveBtn.textContent = 'Kaydediliyor...';
      saveBtn.disabled = true;
      const inps = document.querySelectorAll('[data-f2id]');
      for(const inp of inps){
        const sid = inp.dataset.f2id;
        const val = inp.value.trim();
        const st = studentById(sid);
        if(st && (st.dershane||'') !== val){
          st.dershane = val;
          await updateStudentField(sid, 'dershane', val);
        }
      }
      closeModal();
      showToast('Form-2 dershane bilgileri güncellendi');
      render();
    };
  }
}

function exportClassBackup(){
  const cls = state.cls;
  if(!cls.students.length){ showToast('Sınıfta öğrenci yok, yedek oluşturulamadı'); return; }
  const g12 = isGrade12(cls.name);
  const showTytAyt = g12 || isGrade11(cls.name);
  const sorted = sortedStudents();
  const wb = XLSX.utils.book_new();

  addSheet(wb, sorted.map(s=>{
    const row = { 'No': s.no||'', 'Ad Soyad': s.name };
    row['Ödev %'] = hwPct(s.id);
    row['Yapılmayan Ödev'] = missedCount(s.id);
    row['FL-27 Sayısı'] = fl27Count(s.id);
    row['Okulda Yok'] = s.absent?'Evet':'Hayır';

    row['Öğretmen Notu'] = s.teacher_note||'';
    return row;
  }), 'Öğrenciler');

  const today = todayStr();
  if(cls.homeworks.length || !g12){

      hwHeader.push(h.topic || ('Ödev #' + h.slot_no));
    });
    hwAoa.push(hwHeader);

    sorted.forEach(s=>{
      const row = [s.no || '', s.name];
      cls.homeworks.forEach(h=>{
        const done = !!(cls.hwStatus[s.id] || {})[h.slot_no];
        const checked = h.check_date && h.check_date <= today;
        let statusVal = '';
        if(done){
          statusVal = '✓';
        } else if(!checked){
          statusVal = 'Bekliyor';
        } else {
          statusVal = '✗';
        }
        row.push(statusVal);
      });
      hwAoa.push(row);
    });

    const safeHwAoa = hwAoa.map(r => r.map(c => sanitizeCell(c)));

    const hwCols = [
      { wch: 10 },
      { wch: 28 },
    ];
    cls.homeworks.forEach(h=>{
      const title = String(h.topic || ('Ödev #' + h.slot_no));
      hwCols.push({ wch: Math.min(Math.max(title.length + 4, 14), 45) });
    });
    wsHw['!cols'] = hwCols;

    XLSX.utils.book_append_sheet(wb, wsHw, 'Ödevler');
  }

  if(!g12 && cls.quizzes.length){

    const qzAoa = [];

    sortedQuizzes.forEach(q=>{
      const title = formatExamLabel(q.label);
      if(isQuizExam(q.label)){
        qzHeader.push(title + ' (Puan)');
      } else {
        qzHeader.push(title + ' Net');
        qzHeader.push(title + ' (D/Y/B)');
      }
    });
    qzAoa.push(qzHeader);

    sorted.forEach(s=>{
      const row = [s.no || '', s.name];
      sortedQuizzes.forEach(q=>{
        const v = (cls.quizScores[s.id]||{})[q.slot_no] || {};
        if(isQuizExam(q.label)){
          row.push(v.score != null ? (isGirmedi(v.score) ? 'G (Girmedi)' : v.score) : '-');
        } else {
          if(v.dogru != null || v.yanlis != null || v.bos != null){
            const d = v.dogru || 0;
            const y = v.yanlis || 0;
            const b = v.bos || 0;
            const net = Math.round((d - (y / 4)) * 100) / 100;
            row.push(net);
            row.push(d + 'D ' + y + 'Y ' + b + 'B');
          } else {
            row.push('-');
            row.push('-');
          }
        }
      });
      qzAoa.push(row);
    });

    const safeQzAoa = qzAoa.map(r => r.map(c => sanitizeCell(c)));
    const wsQz = XLSX.utils.aoa_to_sheet(safeQzAoa);
    const qzCols = [{ wch: 10 }, { wch: 28 }];
    sortedQuizzes.forEach(q=>{

    }

          grades.push(total.grade);
        } else {
          row.push('-');
        }
      });
      if(cls.perfTasks.length > 1){
        const avg = grades.length ? Math.round((grades.reduce((a,b)=>a+b,0)/grades.length)*10)/10 : '-';
        row.push(avg);
      }
      perfAoa.push(row);
    });

    const safePerfAoa = perfAoa.map(r => r.map(c => sanitizeCell(c)));
    const wsPerf = XLSX.utils.aoa_to_sheet(safePerfAoa);

    const perfCols = [
      { wch: 10 },
      { wch: 28 },
    ];

          'Görüşmeyi Yapan': n.interviewer||'', 'Neden': n.reason||'',
          'İçerik': n.content||'', 'Değerlendirme': n.evaluation||'',
        });
      });
    });
    addSheet(wb, rows, 'Danışmanlık');

    const ugRows = [];

            'Meslek/Bölüm': goal.profession||'', 'Üniversite': goal.university||'',
            'Almanya İsteği': g.germany_interest===true?'Evet':(g.germany_interest===false?'Hayır':'') });
        });
      });
    });
    addSheet(wb, ugRows, 'Üniversite Hedefleri');

    const acRows = [];
    sorted.forEach(s=>{
      const ac = cls.abroadConsulting[s.id];

          'TR Bölüm': tr.profession||'', 'TR Üniversite': tr.university||'',
          'DE Bölüm': de.profession||'', 'DE Üniversite': de.university||'',
          'Randevu İstiyor': i===0?(ac.wants_appointment?'Evet':'Hayır'):'',
          'Alman Başvurusuna Katılmak İstiyor': i===0?(ac.wants_german_application?'Evet':'Hayır'):'',

  logActivity('Excel yedeği indirdi');

async function loadClassDetail(classId){
  state.loading = true; render();
  const classObj = state.classes.find(c=>c.id===classId);
  const { data: students } = await sb.from('students').select('*').eq('class_id',classId).order('sort_order');
  const { data: homeworks } = await sb.from('homeworks').select('*').eq('class_id',classId).order('slot_no');
  const { data: quizzes } = await sb.from('quizzes').select('*').eq('class_id',classId).order('slot_no');
  const { data: perfTasks } = await sb.from('performance_tasks').select('*').eq('class_id',classId).order('slot_no');
  const { data: denemeExams } = await sb.from('deneme_exams').select('*').eq('class_id',classId).order('slot_no');
  const { data: classEvaluations } = await sb.from('class_evaluations').select('*').eq('class_id',classId).order('created_at');
  const ids = (students||[]).map(s=>s.id);
  let hwStatusRows=[], rubricScoreRows=[], quizScoreRows=[], denemeScoreRows=[], counselingNoteRows=[], universityGoalRows=[], abroadConsultingRows=[], evalMarkRows=[];
  if(ids.length){
    const r1 = await sb.from('homework_status').select('*').in('student_id', ids); hwStatusRows = r1.data||[];
    const r2 = await sb.from('rubric_scores').select('*').in('student_id', ids); rubricScoreRows = r2.data||[];
    const r3 = await sb.from('quiz_scores').select('*').in('student_id', ids); quizScoreRows = r3.data||[];
    const r5 = await sb.from('counseling_notes').select('*').in('student_id', ids).order('note_date', {ascending:false}).order('created_at', {ascending:false});
    counselingNoteRows = r5.data||[];
    const r6 = await sb.from('university_goals').select('*').in('student_id', ids).order('created_at', {ascending:false});
    universityGoalRows = r6.data||[];
    const r7 = await sb.from('abroad_consulting').select('*').in('student_id', ids);
    abroadConsultingRows = r7.data||[];
    const r8 = await sb.from('class_evaluation_marks').select('*').in('student_id', ids);
    evalMarkRows = r8.data||[];
  }
  const examIds = (denemeExams||[]).map(e=>e.id);
  if(examIds.length){
    const r4 = await sb.from('deneme_scores').select('*').in('exam_id', examIds); denemeScoreRows = r4.data||[];
  }
  const { data: rubricRows } = await sb.from('rubrics').select('*').eq('class_id', classId);
  const hwStatus = {};
  for(const row of hwStatusRows){ hwStatus[row.student_id]=hwStatus[row.student_id]||{}; hwStatus[row.student_id][row.slot_no]=row.done; }
  const rubricScores = {};
  for(const row of rubricScoreRows){ rubricScores[row.student_id]=rubricScores[row.student_id]||{}; rubricScores[row.student_id][row.level]=rubricScores[row.student_id][row.level]||{}; rubricScores[row.student_id][row.level][row.criteria_index]=row.score; }
  const rubrics = {};
  for(const row of (rubricRows||[])){ rubrics[row.level]=row.criteria; }
  // Rubrik Koruma & Otomatik Kurtarma:
  // Eğer öğrencilere puan girilmiş fakat rubrik ölçütleri eksik veya boş kalmışsa,
  // girilen puanların ve ölçütlerin kaybolmasını önlemek için ölçütleri otomatik tamamla
  for(const sid in rubricScores){
    for(const lvl in rubricScores[sid]){
      const scoredIndices = Object.keys(rubricScores[sid][lvl]).map(Number);
      const maxIdx = Math.max(-1, ...scoredIndices);
      if(maxIdx >= 0){
        rubrics[lvl] = Array.isArray(rubrics[lvl]) ? rubrics[lvl] : [];
        if(rubrics[lvl].length <= maxIdx){
          while(rubrics[lvl].length <= maxIdx){
            const nextIdx = rubrics[lvl].length;
            rubrics[lvl].push({
              name: 'Ölçüt ' + (nextIdx + 1),
              max: 4,
              levels: [
                { score: 4, label: 'Mükemmel', desc: '' },
                { score: 3, label: 'İyi', desc: '' },
                { score: 2, label: 'Orta', desc: '' },
                { score: 1, label: 'Geliştirilmesi Gerekir', desc: '' }
              ]
            });
          }
          if(!state.isAdmin){
            sb.from('rubrics').upsert({ class_id: classId, level: lvl, criteria: rubrics[lvl] }, { onConflict: 'class_id,level' }).then(()=>{});
          }
        }
      }
    }
  }
  const quizScores = {};
  for(const row of quizScoreRows){
    quizScores[row.student_id]=quizScores[row.student_id]||{};
    quizScores[row.student_id][row.slot_no]={ dogru: row.dogru, yanlis: row.yanlis, bos: row.bos, score: row.score };
  }
  // Otomatik Düzeltme: 443 MEĞRİ YAVUZ 'G' girildiğinde yanlışlıkla 0 kaydedilmişse 'G' olarak düzelt
  const megriStudent = (students || []).find(s => (String(s.no||'').trim() === '443' || (s.name && /MEĞRİ|MEGRI/i.test(s.name))));
  if(megriStudent && quizScores[megriStudent.id]){
    for(const slot in quizScores[megriStudent.id]){
      const sRec = quizScores[megriStudent.id][slot];
      if(sRec && (sRec.score === '0' || sRec.score === 0)){
        sRec.score = 'G';
        if(!state.isAdmin && state.userId){
          sb.from('quiz_scores').upsert({
            student_id: megriStudent.id,
            slot_no: parseInt(slot, 10),
            score: 'G'
          }).then(() => {}).catch(() => {});
        }
      }
    }
  }
  const denemeScoresByExam = {};
  for(const row of denemeScoreRows){
    denemeScoresByExam[row.exam_id] = denemeScoresByExam[row.exam_id]||{};
    denemeScoresByExam[row.exam_id][row.student_id] = denemeScoresByExam[row.exam_id][row.student_id]||{};
    denemeScoresByExam[row.exam_id][row.student_id][row.subject] = { dogru: row.dogru, yanlis: row.yanlis, bos: row.bos };
  }
  const counselingNotes = {};
  for(const row of counselingNoteRows){
    counselingNotes[row.student_id] = counselingNotes[row.student_id]||[];
    counselingNotes[row.student_id].push(row);
  }
  const universityGoals = {};
  for(const row of universityGoalRows){
    universityGoals[row.student_id] = universityGoals[row.student_id]||[];
    universityGoals[row.student_id].push(row);
  }
  const abroadConsulting = {};
  for(const row of abroadConsultingRows){ abroadConsulting[row.student_id] = row; }
  const classEvaluationMarks = {};
  for(const row of evalMarkRows){
    classEvaluationMarks[row.evaluation_id] = classEvaluationMarks[row.evaluation_id]||{};
    classEvaluationMarks[row.evaluation_id][row.student_id] = classEvaluationMarks[row.evaluation_id][row.student_id]||{};
    classEvaluationMarks[row.evaluation_id][row.student_id][row.criteria_index] = { checked: row.checked, note: row.note };
  }
  let effectivePerfTasks = perfTasks||[];
  const g = getGradeLevel(classObj?classObj.name:'');
  // Eğer bu sınıfta henüz performans ödevi yoksa, diğer tüm kullanıcıların aynı seviyedeki sınıflarından otomatik devral
  if(!effectivePerfTasks.length && g && g!=='12' && !state.isAdmin){
    try {
      const { data: allSameClasses } = await sb.from('classes').select('id, name');
      const targetIds = (allSameClasses||[]).filter(c => c.id !== classId && getGradeLevel(c.name) === g).map(c => c.id);
      if(targetIds.length){
        const { data: existingTasks } = await sb.from('performance_tasks').select('*').in('class_id', targetIds).order('slot_no');
        if(existingTasks && existingTasks.length){
          const uniqueLabels = [...new Set(existingTasks.map(t=>t.label))];
          for(let i=0; i<uniqueLabels.length; i++){
            const lbl = uniqueLabels[i];
            const refT = existingTasks.find(x=>x.label===lbl && (x.given_date || x.due_date)) || existingTasks.find(x=>x.label===lbl);
            let ins = null;
            const res = await sb.from('performance_tasks').insert({
              class_id: classId,
              slot_no: i + 1,
              label: lbl,
              given_date: (refT && refT.given_date) || null,
              due_date: (refT && refT.due_date) || null
            }).select();
            if(res.error && (res.error.message.includes('given_date') || res.error.message.includes('due_date'))){
              const res2 = await sb.from('performance_tasks').insert({ class_id: classId, slot_no: i + 1, label: lbl }).select();
              ins = res2.data;
            } else {
              ins = res.data;
            }
            if(ins && ins[0]){
              if(!ins[0].given_date && refT && refT.given_date) ins[0].given_date = refT.given_date;
              if(!ins[0].due_date && refT && refT.due_date) ins[0].due_date = refT.due_date;
              effectivePerfTasks.push(ins[0]);
            }

            const { data: refR } = await sb.from('rubrics').select('criteria').eq('level', lbl).in('class_id', targetIds);
            const bestRef = (refR || []).filter(r => Array.isArray(r.criteria) && r.criteria.length > 0)
                                        .sort((a,b) => b.criteria.length - a.criteria.length)[0];
            if(bestRef && bestRef.criteria && (!rubrics[lbl] || !rubrics[lbl].length || bestRef.criteria.length > rubrics[lbl].length)){
              rubrics[lbl] = bestRef.criteria;
              await sb.from('rubrics').upsert({ class_id: classId, level: lbl, criteria: bestRef.criteria }, { onConflict: 'class_id,level' });
            }
          }
        }
      }
    } catch(err){
      console.warn('Auto-inherit performance tasks error:', err);
    }
  }

  // Ödev var ama rubrik ölçütleri boşsa şablonu en dolu kaynaktan otomatik tamamla
  if(effectivePerfTasks.length && g && g!=='12' && !state.isAdmin){
    for(const t of effectivePerfTasks){
      if(!rubrics[t.label] || !rubrics[t.label].length){
        try {
          const { data: refR } = await sb.from('rubrics').select('criteria').eq('level', t.label).not('criteria', 'is', null);
          const bestRef = (refR || []).filter(r => Array.isArray(r.criteria) && r.criteria.length > 0)
                                      .sort((a,b) => b.criteria.length - a.criteria.length)[0];
          if(bestRef && bestRef.criteria && bestRef.criteria.length > 0){
            rubrics[t.label] = bestRef.criteria;
            await sb.from('rubrics').upsert({ class_id: classId, level: t.label, criteria: bestRef.criteria }, { onConflict: 'class_id,level' });
          }
        } catch(e){}
      }
    }
  }

  // Ödev var ama tarihleri boşsa, aynı seviyedeki diğer sınıflardan tarihleri otomatik devral ve eşitle
  if(effectivePerfTasks.length && g && g!=='12' && !state.isAdmin){
    const missingDateTasks = effectivePerfTasks.filter(t => !t.given_date || !t.due_date);
    if(missingDateTasks.length){
      try {
        const { data: allSameClasses } = await sb.from('classes').select('id, name');
        const targetIds = (allSameClasses||[]).filter(c => c.id !== classId && getGradeLevel(c.name) === g).map(c => c.id);
        if(targetIds.length){
          const { data: siblingTasks } = await sb.from('performance_tasks').select('label, given_date, due_date').in('class_id', targetIds);
          if(siblingTasks && siblingTasks.length){
            for(const t of missingDateTasks){
              const ref = siblingTasks.find(x => x.label === t.label && (x.given_date || x.due_date));
              if(ref){
                let updated = false;
                const updateData = {};
                if(!t.given_date && ref.given_date){ t.given_date = ref.given_date; updateData.given_date = ref.given_date; updated = true; }
                if(!t.due_date && ref.due_date){ t.due_date = ref.due_date; updateData.due_date = ref.due_date; updated = true; }
                if(updated){
                  await sb.from('performance_tasks').update(updateData).eq('class_id', classId).eq('label', t.label);
                }
              }
            }
          }
        }
      } catch(e){
        console.warn('Auto-sync performance task dates error:', e);
      }
    }
  }

  state.cls = {
    id: classId, name: classObj?classObj.name:'',
    students: students||[], homeworks: homeworks||[], hwStatus,
    quizzes: sortQuizzes(quizzes||[]), quizScores,
    perfTasks: effectivePerfTasks, rubrics, rubricScores,
    tytExams: (denemeExams||[]).filter(e=>e.exam_type==='tyt'),
    aytExams: (denemeExams||[]).filter(e=>e.exam_type==='ayt'),
    denemeScoresByExam,
    counselingNotes,
    universityGoals,
    abroadConsulting,
    classEvaluations: classEvaluations||[],
    classEvaluationMarks,
  };
  state.rubricLevel = (state.cls.perfTasks[0] && state.cls.perfTasks[0].label) || null;
  state.loading = false;
  render();
}

function assignedCount(){ const today=todayStr(); return (state.cls && state.cls.homeworks) ? state.cls.homeworks.filter(h=>h.check_date && h.check_date<=today).length : 0; }
function completedCount(sid){ const today=todayStr(); const st=(state.cls && state.cls.hwStatus && state.cls.hwStatus[sid])||{}; let n=0; if(state.cls && state.cls.homeworks){ state.cls.homeworks.forEach(h=>{ if(h.check_date && h.check_date<=today && st[h.slot_no]) n++; }); } return n; }
function missedHomeworks(sid){
  const today = todayStr();
  const st = (state.cls && state.cls.hwStatus && state.cls.hwStatus[sid]) || {};
  if(!state.cls || !state.cls.homeworks) return [];
  return state.cls.homeworks.filter(h => h.check_date && h.check_date <= today && !st[h.slot_no]);
}
function missedCount(sid){
  return missedHomeworks(sid).length;
}
function fl27Count(sid){
  return Math.floor(missedCount(sid) / 3);
}
function fl27Remainder(sid){
  return missedCount(sid) % 3;
}
function totalClassFl27(){
  if(!state.cls || !state.cls.students) return 0;
  return state.cls.students.reduce((sum, s)=> sum + fl27Count(s.id), 0);
}
function hwPct(sid){ const a=assignedCount(); if(a===0) return 0; return Math.round((completedCount(sid)/a)*100); }
function hwClassAvg(){ const vals=(state.cls && state.cls.students) ? state.cls.students.map(s=>hwPct(s.id)) : []; if(!vals.length) return null; return Math.round(vals.reduce((a,b)=>a+b,0)/vals.length); }
function rubricTotal(sid, level){
  const crit=state.cls.rubrics[level]||[];
  const scores=(state.cls.rubricScores[sid]||{})[level]||{};
  let sum=0,max=0,any=false;
  crit.forEach((c,i)=>{ max+=c.max; if(scores[i]!=null){ sum+=scores[i]; any=true; } });
  for(const k in scores){
    const idx = Number(k);
    if(idx >= crit.length && scores[k] != null){
      sum += Number(scores[k]);
      max += 4;
      any = true;
    }
  }
  return {sum,max,grade: (any && max > 0)?Math.round(sum/max*100):null};
}
function perfTaskAvg(label){
  const vals = state.cls.students.map(s=>rubricTotal(s.id,label).grade).filter(v=>v!=null);
  if(!vals.length) return null;
  return Math.round((vals.reduce((a,b)=>a+b,0)/vals.length)*10)/10;
}
function perfClassAvg(){
  const vals=[];
  state.cls.students.forEach(s=>{ state.cls.perfTasks.forEach(t=>{ const g=rubricTotal(s.id,t.label).grade; if(g!=null) vals.push(g); }); });
  if(!vals.length) return null;
  return Math.round((vals.reduce((a,b)=>a+b,0)/vals.length)*10)/10;
}
function quizSlotAvgDYB(slotNo){
  if(!state.cls || !state.cls.students) return null;
  const entries = state.cls.students.map(s=>(state.cls.quizScores[s.id]||{})[slotNo]).filter(v=>v && (v.dogru!=null||v.yanlis!=null||v.bos!=null||v.score!=null));
  if(!entries.length) return null;

  const parseNum = (v) => {
    if(v == null) return null;
    if(isGirmedi(v)) return null;
    const str = String(v).trim();
    if(str === '') return null;
    const num = parseFloat(str.replace(',', '.'));
    return isNaN(num) ? null : num;
  };

  const avg = (key)=>{
    const vals = entries.map(e=>parseNum(e[key])).filter(v=>v!==null);
    if(!vals.length) return null;
    const sum = vals.reduce((a,b)=>a+b, 0);
    return Math.round((sum / vals.length) * 100) / 100;
  };

  const dAvg = avg('dogru'), yAvg = avg('yanlis'), bAvg = avg('bos'), sAvg = avg('score');
  const netAvg = dAvg!=null ? Math.round((dAvg - ((yAvg||0)/4))*100)/100 : null;
  const scoreVals = entries.map(e=>parseNum(e.score)).filter(v=>v!==null);
  const minScore = scoreVals.length ? Math.min(...scoreVals) : null;
  const maxScore = scoreVals.length ? Math.max(...scoreVals) : null;
  return { dogru: dAvg, yanlis: yAvg, bos: bAvg, net: netAvg, score: sAvg, minScore, maxScore };
}

async function importStudentsFromExcel(file){
  if(state.isAdmin){ showToast('Yönetici modunda öğrenci listesi yüklenemez (Salt Okunur).'); return; }
  if(!file || !checkFileSize(file)) return;
  showToast('Dosya okunuyor...');
  try{
    const buf = await file.arrayBuffer();
    const wb = XLSX.read(buf, {type:'array'});
    const sheet = wb.Sheets[wb.SheetNames[0]];
    const rows = XLSX.utils.sheet_to_json(sheet, {header:1, raw:false, defval:''});
    if(!rows.length){ showToast('Dosya boş görünüyor'); return; }

    const isStudentNoCol = (str)=>{
      const h = String(str||'').trim().toLocaleLowerCase('tr');
      if(['no', 'okul no', 'öğrenci no', 'ogrenci no', 'numara', 'numarası', 'ogr no', 'öğr no', 'öğr. no', 'kno'].includes(h)) return true;
      if(/^(öğrenci|okul|ogr|öğr)[\s._-]*(no|numara|numarası)$/i.test(h)) return true;
      if(/^no$/i.test(h)) return true;
      return false;
    };

    let startRow=0, noCol=-1, nameCol=-1, firstCol=-1, lastCol=-1;
    const header = rows[0].map(c=>String(c).trim().toLocaleLowerCase('tr'));
    const looksLikeHeader = header.some(h=>isStudentNoCol(h) || h.includes('ad') || h.includes('isim') || h.includes('soyad'));
    if(looksLikeHeader){
      startRow=1;
      header.forEach((h,i)=>{
        if(isStudentNoCol(h)){
          if(noCol===-1 || h.includes('öğrenci') || h.includes('okul')) noCol=i;
        }
        else if(h.includes('ad') && h.includes('soyad')) nameCol=i;
        else if((h.includes('ad') || h.includes('isim')) && firstCol===-1 && !h.includes('soyad')) firstCol=i;
        else if(h.includes('soyad')) lastCol=i;
      });
    }
    if(noCol===-1) noCol=0;
    if(nameCol===-1 && firstCol===-1) nameCol=1;

    const maxOrder = Math.max(0, ...state.cls.students.map(s=>s.sort_order||0));
    const newRows = []; let order = maxOrder;
    for(let r=startRow; r<rows.length; r++){
      const row = rows[r];
      if(!row || row.every(c=>String(c).trim()==='')) continue;
      let no = noCol>=0 ? String(row[noCol]??'').trim() : '';
      if(no.length > 20) no = no.slice(0, 20);
      let name;
      if(firstCol>=0 && lastCol>=0){ name=(String(row[firstCol]??'').trim()+' '+String(row[lastCol]??'').trim()).trim(); }
      else { name = String(row[nameCol]??'').trim(); }
      if(!name) continue;
      if(name.length > 100) name = name.slice(0, 100);
      order++;
      newRows.push({class_id: state.cls.id, no: no||null, name, sort_order: order});
    }
    if(!newRows.length){ showToast('Öğrenci satırı bulunamadı'); return; }
    const { data, error } = await sb.from('students').insert(newRows).select();
    if(error){ showToast('Hata: '+error.message); return; }
    state.cls.students = state.cls.students.concat(data||[]);
    render();
    logActivity('Excelden '+newRows.length+' öğrenci ekledi');
    showToast(newRows.length+' öğrenci eklendi');
  }catch(err){ showToast('Dosya okunamadı: '+err.message); }
}
