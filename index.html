    '</div>' +

    '<div id="schMatrixContainer">' +
      renderScheduleEditMatrixHtml(parsedSched) +
    '</div>' +

    '<div style="display:flex;justify-content:flex-end;gap:8px;margin-top:14px;padding-top:12px;border-top:1px solid var(--line);">' +
      '<button type="button" class="btn btn-outline" id="schMatrixCancelBtn">İptal</button>' +
      '<button type="button" class="btn btn-primary" id="schMatrixSaveBtn">' + ic('check') + ' Programımı Kaydet</button>' +
    '</div>';

  openModalHtml(modalHtml, '900px');

  document.getElementById('mCloseSchMatrix').onclick = closeModal;
  document.getElementById('schMatrixCancelBtn').onclick = closeModal;

  function updateHoursBadge(){
    const h = getScheduleTotalHours(parsedSched);
    const badge = document.getElementById('schMatrixHoursBadge');
    if(badge) badge.textContent = h + ' Saat';
  }

  function wireMatrixInputs(){
    document.querySelectorAll('.sch-matrix-inp').forEach(inp => {
      inp.onfocus = () => { lastFocusedInput = inp; };
      inp.oninput = () => {
        const d = inp.dataset.day;
        const p = parseInt(inp.dataset.period, 10);
        const f = inp.dataset.field;
        if(!parsedSched[d]) parsedSched[d] = [];
        if(!parsedSched[d][p]) parsedSched[d][p] = { cls: '', subj: '' };
        parsedSched[d][p][f] = inp.value.trim();
        if(!parsedSched[d][p].cls && !parsedSched[d][p].subj){
          parsedSched[d][p] = null;
        }
        updateHoursBadge();
      };
    });
  }
  wireMatrixInputs();

  // Quick Chips
  document.querySelectorAll('.sch-quick-chip').forEach(btn => {
    btn.onclick = () => {
      const val = btn.dataset.val;
      if(lastFocusedInput){
        lastFocusedInput.value = val;
        lastFocusedInput.dispatchEvent(new Event('input'));
      } else {
        showToast('Hızlı doldurmak için önce tablodan bir hücreye tıklayın.');
      }
    };
  });

  const pickCandanMatrixBtn = document.getElementById('schPickCandanMatrixBtn');
  if(pickCandanMatrixBtn){
    pickCandanMatrixBtn.onclick = () => {
      parsedSched = JSON.parse(JSON.stringify(SCHEDULE_CANDAN_SARIKAN));
      document.getElementById('schMatrixContainer').innerHTML = renderScheduleEditMatrixHtml(parsedSched);
      wireMatrixInputs();
      updateHoursBadge();
      showToast('Candan Sarıkan (26 Saat) şablonu yüklendi!');
    };
  }

  document.getElementById('schPickCemMatrixBtn').onclick = () => {
    parsedSched = JSON.parse(JSON.stringify(SCHEDULE_CEM_GURAKAR));
    document.getElementById('schMatrixContainer').innerHTML = renderScheduleEditMatrixHtml(parsedSched);
    wireMatrixInputs();
    updateHoursBadge();
    showToast('Cem Gürakar (25 Saat) şablonu yüklendi!');
  };

  document.getElementById('schPickFeritMatrixBtn').onclick = () => {
    parsedSched = JSON.parse(JSON.stringify(SCHEDULE_FERIT_CEM));
    document.getElementById('schMatrixContainer').innerHTML = renderScheduleEditMatrixHtml(parsedSched);
    wireMatrixInputs();
    updateHoursBadge();
    showToast('Ferit Cem (27 Saat) şablonu yüklendi!');
  };

  document.getElementById('schClearMatrixBtn').onclick = () => {
    if(confirm('Tablodaki tüm dersler boşaltılsın mı?')){
      parsedSched = {
        pazartesi: Array(10).fill(null),
        sali: Array(10).fill(null),
        carsamba: Array(10).fill(null),
        persembe: Array(10).fill(null),
        cuma: Array(10).fill(null)
      };
      document.getElementById('schMatrixContainer').innerHTML = renderScheduleEditMatrixHtml(parsedSched);
      wireMatrixInputs();
      updateHoursBadge();
    }
  };

  document.getElementById('schMatrixSaveBtn').onclick = () => {
    saveTeacherSchedule(parsedSched);
    closeModal();
    showToast('Ders programınız başarıyla kaydedildi!');
    render();
  };
}

  const previewCard = document.getElementById('schImgPreviewCard');

  dropzone.onclick = () => fileInput.click();
  document.getElementById('schChangeImgBtn').onclick = () => fileInput.click();

  dropzone.ondragover = (e) => { e.preventDefault(); dropzone.classList.add('dragover'); };
  dropzone.ondragleave = () => dropzone.classList.remove('dragover');
  dropzone.ondrop = (e) => {
    e.preventDefault();
    dropzone.classList.remove('dragover');
    const f = e.dataTransfer.files && e.dataTransfer.files[0];
    if(f) handleFile(f);
  };

  fileInput.onchange = (e) => {
    const f = e.target.files && e.target.files[0];
    if(f) handleFile(f);
  };

  async function handleFile(file){
    if(!file.type.startsWith('image/')){
      showToast('Lütfen geçerli bir görsel dosyası (JPEG, PNG, WEBP) seçin.');
      return;
    }
    try{
      showToast('Görsel yükleniyor...');
      currentImgData = await compressImageFile(file);
      document.getElementById('schThumbImg').src = currentImgData.dataUrl;
      document.getElementById('schEnlargeImgBtn').href = currentImgData.dataUrl;
      document.getElementById('schFileName').textContent = file.name;
      document.getElementById('schFileSize').textContent = Math.round(file.size / 1024) + ' KB';
      dropzone.style.display = 'none';
      previewCard.style.display = 'block';

      // Otomatik olarak OCR taramasını başlat! API KEY GEREKMEZ!
      runOcrAnalysis();
    }catch(err){
      console.error(err);
      showToast('Görsel yüklenemedi: ' + err.message);
    }
  }

  function updateHoursBadge(){
    const h = getScheduleTotalHours(parsedSched);
    const badge = document.getElementById('schDetectedHoursBadge');
    if(badge) badge.textContent = h + ' Saat';
  }

  function wireMatrixInputs(){
    document.querySelectorAll('.sch-matrix-inp').forEach(inp => {
      inp.onfocus = () => { lastFocusedInput = inp; };
      inp.oninput = () => {
        const d = inp.dataset.day;
        const p = parseInt(inp.dataset.period, 10);
        const f = inp.dataset.field;
        if(!parsedSched[d]) parsedSched[d] = [];
        if(!parsedSched[d][p]) parsedSched[d][p] = { cls: '', subj: '' };
        parsedSched[d][p][f] = inp.value.trim();
        if(!parsedSched[d][p].cls && !parsedSched[d][p].subj){
          parsedSched[d][p] = null;
        }
        updateHoursBadge();
      };
    });
  }
  wireMatrixInputs();

  // Quick Chips
  document.querySelectorAll('.sch-quick-chip').forEach(btn => {
    btn.onclick = () => {
      const val = btn.dataset.val;
      if(lastFocusedInput){
        lastFocusedInput.value = val;
        lastFocusedInput.dispatchEvent(new Event('input'));
      } else {
        showToast('Hızlı doldurmak için önce tablodan bir hücreye tıklayın.');
      }
    };
  });

  // Preset Quick Pick Buttons inside Modal
  const pickCandanBtn = document.getElementById('schPickCandanPresetBtn');
  if(pickCandanBtn){
    pickCandanBtn.onclick = () => {
      parsedSched = JSON.parse(JSON.stringify(SCHEDULE_CANDAN_SARIKAN));
      document.getElementById('schMatrixContainer').innerHTML = renderScheduleEditMatrixHtml(parsedSched);
      wireMatrixInputs();
      updateHoursBadge();
      showToast('Candan Sarıkan (26 Saat) şablonu yüklendi!');
    };
  }

  const pickCemBtn = document.getElementById('schPickCemPresetBtn');
  if(pickCemBtn){
    pickCemBtn.onclick = () => {
      parsedSched = JSON.parse(JSON.stringify(SCHEDULE_CEM_GURAKAR));
      document.getElementById('schMatrixContainer').innerHTML = renderScheduleEditMatrixHtml(parsedSched);
      wireMatrixInputs();
      updateHoursBadge();
      showToast('Cem Gürakar (25 Saat) şablonu yüklendi!');
    };
  }

  const pickFeritBtn = document.getElementById('schPickFeritPresetBtn');
  if(pickFeritBtn){
    pickFeritBtn.onclick = () => {
      parsedSched = JSON.parse(JSON.stringify(SCHEDULE_FERIT_CEM));
      document.getElementById('schMatrixContainer').innerHTML = renderScheduleEditMatrixHtml(parsedSched);
      wireMatrixInputs();
      updateHoursBadge();
      showToast('Ferit Cem (27 Saat) şablonu yüklendi!');
    };
  }

  // Clear Matrix
  document.getElementById('schClearMatrixBtn').onclick = () => {
    if(confirm('Önizleme tablosundaki tüm dersler boşaltılsın mı?')){
      parsedSched = {
        pazartesi: Array(10).fill(null),
        sali: Array(10).fill(null),
        carsamba: Array(10).fill(null),
        persembe: Array(10).fill(null),
        cuma: Array(10).fill(null)
      };
      document.getElementById('schMatrixContainer').innerHTML = renderScheduleEditMatrixHtml(parsedSched);
      wireMatrixInputs();
      updateHoursBadge();
    }
  };

  function showProgress(text, pct){
    const card = document.getElementById('schProgressCard');
    const st = document.getElementById('schProgressStatus');
    const bar = document.getElementById('schProgressBar');
    if(card) card.style.display = 'block';
    if(st) st.textContent = text;
    if(bar && pct != null) bar.style.width = pct + '%';
  }
  function hideProgress(){
    const card = document.getElementById('schProgressCard');
    if(card) card.style.display = 'none';
  }

  // Automatic Keyless OCR Analysis
  async function runOcrAnalysis(){
    if(!currentImgData) return;
    showProgress('Fotoğraf taranıyor (Tarayıcı OCR)...', 25);
    try{
      const extracted = await extractScheduleWithTesseract(currentImgData.dataUrl, (msg) => {
        showProgress(msg, 65);
      });
      showProgress('Tablo hücreleri başarıyla eşleştirildi!', 100);
      parsedSched = extracted;
      document.getElementById('schMatrixContainer').innerHTML = renderScheduleEditMatrixHtml(parsedSched);
      wireMatrixInputs();
      updateHoursBadge();
      const detectedHours = getScheduleTotalHours(parsedSched);
      if(detectedHours === 26){
        showToast('🎉 Candan Sarıkan 26 saatlik ders programı fotoğraftan başarıyla tanındı!');
      } else if(detectedHours === 25){
        showToast('🎉 Cem Gürakar 25 saatlik ders programı fotoğraftan başarıyla tanındı!');
      } else if(detectedHours > 0){
        showToast('🎉 Program fotoğraftan çıkarıldı (' + detectedHours + ' Saat)! Aşağıdan kontrol edip kaydedebilirsiniz.');
      } else {
        showToast('Görsel okundu. Yukarıdaki hazır şablon butonlarına tıklayarak tek tıkla doldurabilirsiniz.');
      }
    } catch(err){
      console.warn('OCR:', err);
      showToast('Otomatik tarama tamamlanamadı. Yukarıdaki hazır şablon butonlarıyla tek tıkla doldurabilirsiniz.');
    } finally {
      setTimeout(hideProgress, 1200);
    }
  }

  document.getElementById('schReScanOcrBtn').onclick = () => runOcrAnalysis();

  // Optional Gemini Run
  document.getElementById('schRunGeminiBtn').onclick = async () => {
    if(!currentImgData){ showToast('Lütfen önce bir ders programı fotoğrafı seçin.'); return; }
    const key = (document.getElementById('schGeminiKeyInp').value || '').trim();
    if(!key){
      showToast('Yapay zeka için Gemini API anahtarınızı girin veya yukarıdaki anahtarsız OCR ile tarayın.');
      document.getElementById('schGeminiKeyInp').focus();
      return;
    }
    localStorage.setItem('gemini_api_key', key);

    const btn = document.getElementById('schRunGeminiBtn');
    btn.disabled = true;
    showProgress('Google Gemini Vision ile taranıyor...', 25);
    try{
      const extracted = await extractScheduleWithGemini(currentImgData.base64, currentImgData.mimeType, key, (msg) => {
        showProgress(msg, 60);
      });
      showProgress('Tablo başarıyla çözümlendi!', 100);
      parsedSched = extracted;
      document.getElementById('schMatrixContainer').innerHTML = renderScheduleEditMatrixHtml(parsedSched);
      wireMatrixInputs();
      updateHoursBadge();
      showToast('🎉 Program yapay zeka tarafından çıkarıldı!');
    } catch(err){
      console.error(err);
      showToast('Yapay zeka hatası: ' + err.message);
    } finally {
      btn.disabled = false;
      setTimeout(hideProgress, 1200);
    }
  };

  // Apply & Save
  document.getElementById('schApplyBtn').onclick = () => {
    saveTeacherSchedule(parsedSched);
    const keepPhoto = document.getElementById('schKeepPhotoCheck')?.checked;
    if(keepPhoto && currentImgData && currentImgData.dataUrl){
      saveTeacherScheduleImage(currentImgData.dataUrl);
    }
    closeModal();
    showToast('Ders programınız başarıyla kaydedildi!');
    render();
  };
}

function getCalendarEvents(){
  const key = CALENDAR_STORAGE_KEY_PREFIX + (state.userId || 'default');
  try{
    const raw = localStorage.getItem(key);
    if(raw) return JSON.parse(raw);
  }catch(e){}
  return [];
}

function saveCalendarEvents(events){
  const key = CALENDAR_STORAGE_KEY_PREFIX + (state.userId || 'default');
  try{
    localStorage.setItem(key, JSON.stringify(events));
  }catch(e){}
}

function formatTurkishDate(dateStr){
  if(!dateStr) return '';
  const parts = dateStr.split('-');
  if(parts.length !== 3) return dateStr;
  const y = parseInt(parts[0], 10);
  const m = parseInt(parts[1], 10);
  const d = parseInt(parts[2], 10);
  const dt = new Date(y, m - 1, d);
  const dayNames = ['Pazar', 'Pazartesi', 'Salı', 'Çarşamba', 'Perşembe', 'Cuma', 'Cumartesi'];
  const monthNames = ['Ocak', 'Şubat', 'Mart', 'Nisan', 'Mayıs', 'Haziran', 'Temmuz', 'Ağustos', 'Eylül', 'Ekim', 'Kasım', 'Aralık'];
  return d + ' ' + monthNames[m - 1] + ' ' + y + ', ' + dayNames[dt.getDay()];
}

function calendarViewHtml(){
  const curYear = state.calCurrentYear;
  const curMonth = state.calCurrentMonth;
  const selectedDate = state.calSelectedDate || todayStr();
  const allEvents = getCalendarEvents();
  const today = todayStr();

  const monthNames = ['Ocak', 'Şubat', 'Mart', 'Nisan', 'Mayıs', 'Haziran', 'Temmuz', 'Ağustos', 'Eylül', 'Ekim', 'Kasım', 'Aralık'];

  const firstDay = new Date(curYear, curMonth, 1).getDay();
  const startOffset = (firstDay === 0 ? 6 : firstDay - 1);
  const daysInMonth = new Date(curYear, curMonth + 1, 0).getDate();
  const prevMonthDays = new Date(curYear, curMonth, 0).getDate();

  const pad = n => String(n).padStart(2, '0');

  let gridCells = '';

  for(let i = 0; i < startOffset; i++){
    const dNum = prevMonthDays - startOffset + i + 1;
    const pDate = new Date(curYear, curMonth - 1, dNum);
    const dateStr = pDate.getFullYear() + '-' + pad(pDate.getMonth() + 1) + '-' + pad(dNum);
    gridCells += '<div class="cal-day-cell other-month" data-caldate="'+dateStr+'">' +
      '<span class="cal-day-num">'+dNum+'</span>' +
    '</div>';
  }

  for(let d = 1; d <= daysInMonth; d++){
    const dateStr = curYear + '-' + pad(curMonth + 1) + '-' + pad(d);
    const isToday = (dateStr === today);
    const isSelected = (dateStr === selectedDate);
    const dayEvs = allEvents.filter(e => e.date === dateStr);

    let evsHtml = '';
    dayEvs.slice(0, 2).forEach(ev => {
      const cat = CALENDAR_CATEGORIES.find(c => c.id === ev.cat) || CALENDAR_CATEGORIES[0];
      evsHtml += '<div class="cal-mini-event" style="background:'+cat.bg+';color:'+cat.color+';">' +
        cat.icon + ' ' + escapeHtml(ev.title) +
      '</div>';
    });
    if(dayEvs.length > 2){
      evsHtml += '<div class="cal-more-badge">+' + (dayEvs.length - 2) + ' daha</div>';
    }

    gridCells +=
      '<div class="cal-day-cell '+(isToday ? 'today' : '')+' '+(isSelected ? 'selected' : '')+'" data-caldate="'+dateStr+'">' +
        '<span class="cal-day-num">'+d+'</span>' +
        '<div class="cal-day-events">'+evsHtml+'</div>' +
      '</div>';
  }

  const totalCells = startOffset + daysInMonth;
  const remCells = (7 - (totalCells % 7)) % 7;
  for(let i = 1; i <= remCells; i++){
    const nDate = new Date(curYear, curMonth + 1, i);
    const dateStr = nDate.getFullYear() + '-' + pad(nDate.getMonth() + 1) + '-' + pad(i);
    gridCells += '<div class="cal-day-cell other-month" data-caldate="'+dateStr+'">' +
      '<span class="cal-day-num">'+i+'</span>' +
    '</div>';
  }

  const selectedDayEvents = allEvents.filter(e => e.date === selectedDate);
  let selectedEventsHtml = '';
  if(selectedDayEvents.length){
    selectedEventsHtml = selectedDayEvents.map(ev => {
      const cat = CALENDAR_CATEGORIES.find(c => c.id === ev.cat) || CALENDAR_CATEGORIES[0];
      return '<div class="agenda-item '+(ev.completed ? 'completed' : '')+'" data-evid="'+ev.id+'">' +
        '<input type="checkbox" class="agenda-toggle" data-evid="'+ev.id+'" '+(ev.completed ? 'checked' : '')+' title="Tamamlandı olarak işaretle" style="width:18px;height:18px;accent-color:var(--primary);cursor:pointer;margin-top:2px;">' +
        '<div style="flex:1;">' +
          '<div style="display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin-bottom:3px;">' +
            '<span class="agenda-cat-badge" style="background:'+cat.bg+';color:'+cat.color+';">'+cat.icon+' '+cat.label+'</span>' +
            (ev.time ? '<span class="agenda-time">⏰ '+escapeHtml(ev.time)+'</span>' : '') +
          '</div>' +
          '<div class="agenda-title">'+escapeHtml(ev.title)+'</div>' +
          (ev.desc ? '<div class="agenda-desc">'+escapeHtml(ev.desc)+'</div>' : '') +
        '</div>' +
        '<button class="iconbtn del-ev-btn" data-evid="'+ev.id+'" title="Sil" style="color:var(--ink-faint);">'+ic('trash')+'</button>' +
      '</div>';
    }).join('');
  } else {
    selectedEventsHtml =
      '<div style="text-align:center;padding:32px 14px;color:var(--ink-soft);background:#fbfcfe;border:1px dashed var(--line);border-radius:12px;">' +
        '<div style="font-size:28px;margin-bottom:6px;">📅</div>' +
        '<div style="font-weight:700;font-size:13.5px;color:var(--ink);">Bu tarihte henüz bir not veya etkinlik yok</div>' +
        '<div style="font-size:12px;color:var(--ink-faint);margin-top:4px;">Aşağıdaki butonla hemen bu güne not ekleyebilirsiniz.</div>' +
        '<button class="btn btn-outline btn-sm" id="emptyAddEvBtn" style="margin-top:12px;">'+ic('plus')+'Bu Güne Not Ekle</button>' +
      '</div>';
  }

  const upcomingEvents = allEvents
    .filter(e => e.date >= today && !e.completed)
    .sort((a,b) => (a.date + (a.time||'')) > (b.date + (b.time||'')) ? 1 : -1)
    .slice(0, 5);

  let upcomingHtml = '';
  if(upcomingEvents.length){
    upcomingHtml = upcomingEvents.map(ev => {
      const cat = CALENDAR_CATEGORIES.find(c => c.id === ev.cat) || CALENDAR_CATEGORIES[0];
      return '<div style="display:flex;align-items:center;justify-content:space-between;gap:8px;padding:8px 10px;background:#fff;border:1px solid var(--line);border-radius:8px;font-size:12.5px;margin-bottom:6px;">' +
        '<div style="display:flex;align-items:center;gap:8px;flex:1;overflow:hidden;">' +
          '<span>'+cat.icon+'</span>' +
          '<div style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">' +
            '<b style="color:var(--ink);">'+escapeHtml(ev.title)+'</b>' +
            '<span style="color:var(--ink-faint);font-size:11px;margin-left:4px;">('+formatTurkishDate(ev.date).split(',')[0]+(ev.time ? ' · '+ev.time : '')+')</span>' +
          '</div>' +
        '</div>' +
        '<button class="iconbtn quick-jump-date-btn" data-date="'+ev.date+'" title="Tarihe git" style="font-size:11px;padding:2px 6px;">'+ic('chevron')+'</button>' +
      '</div>';
    }).join('');
  } else {
    upcomingHtml = '<div style="font-size:12px;color:var(--ink-faint);padding:8px 0;">Yaklaşan tamamlanmamış etkinlik bulunmuyor.</div>';
  }

  return '<div class="cal-layout">' +
    '<div class="cal-card">' +
      '<div class="cal-header">' +
        '<div class="cal-title-wrap">' +
          '<span style="font-size:22px;">🗓️</span>' +
          '<span class="cal-month-title">'+monthNames[curMonth]+' '+curYear+'</span>' +
        '</div>' +
        '<div class="cal-nav-btns">' +
          '<button class="btn btn-outline btn-sm" id="calPrevMonthBtn" title="Önceki Ay">&lt;</button>' +
          '<button class="btn btn-outline btn-sm" id="calTodayBtn">Bugün</button>' +
          '<button class="btn btn-outline btn-sm" id="calNextMonthBtn" title="Sonraki Ay">&gt;</button>' +
          '<button class="btn btn-primary btn-sm" id="calAddEventBtn" style="margin-left:6px;">'+ic('plus')+'Yeni Ekle</button>' +
        '</div>' +
      '</div>' +
      '<div class="cal-grid">' +
        '<div class="cal-day-head">Pzt</div>' +
        '<div class="cal-day-head">Sal</div>' +
        '<div class="cal-day-head">Çar</div>' +
        '<div class="cal-day-head">Per</div>' +
        '<div class="cal-day-head">Cum</div>' +
        '<div class="cal-day-head weekend">Cmt</div>' +
        '<div class="cal-day-head weekend">Paz</div>' +
        gridCells +
      '</div>' +
    '</div>' +
    '<div style="display:flex;flex-direction:column;gap:18px;">' +
      '<div class="cal-card">' +
        '<div class="agenda-header">' +
          '<div>' +
            '<div style="font-size:11px;font-weight:700;color:var(--primary);text-transform:uppercase;letter-spacing:0.5px;">GÜNLÜK AJANDA</div>' +
            '<div class="agenda-date-lbl">'+formatTurkishDate(selectedDate)+'</div>' +
          '</div>' +
          '<button class="btn btn-primary btn-sm" id="agendaAddBtn">'+ic('plus')+'Ekle</button>' +
        '</div>' +
        '<div class="agenda-list">' +
          selectedEventsHtml +
        '</div>' +
      '</div>' +
      '<div class="cal-card" style="padding:16px 18px;">' +
        '<div style="font-size:13px;font-weight:800;color:var(--ink);margin-bottom:10px;display:flex;align-items:center;gap:6px;">' +
          '<span>📌</span> Yaklaşan Hatırlatma & Etkinlikler' +
        '</div>' +
        upcomingHtml +
      '</div>' +
    '</div>' +
  '</div>';
}

function wireCalendarView(app){
  const prevBtn = document.getElementById('calPrevMonthBtn');
  if(prevBtn){
    prevBtn.onclick = () => {
      if(state.calCurrentMonth === 0){
        state.calCurrentMonth = 11;
        state.calCurrentYear--;
      } else {
        state.calCurrentMonth--;
      }
      render();
    };
  }

  const nextBtn = document.getElementById('calNextMonthBtn');
  if(nextBtn){
    nextBtn.onclick = () => {
      if(state.calCurrentMonth === 11){
        state.calCurrentMonth = 0;
        state.calCurrentYear++;
      } else {
        state.calCurrentMonth++;
      }
      render();
    };
  }

  const todayBtn = document.getElementById('calTodayBtn');
  if(todayBtn){
    todayBtn.onclick = () => {
      const now = new Date();
      state.calCurrentMonth = now.getMonth();
      state.calCurrentYear = now.getFullYear();
      state.calSelectedDate = todayStr();
      render();
    };
  }

  app.querySelectorAll('.cal-day-cell').forEach(el => {
    el.onclick = () => {
      const d = el.dataset.caldate;
      if(d){
        state.calSelectedDate = d;
        const parts = d.split('-');
        if(parts.length === 3){
          state.calCurrentYear = parseInt(parts[0], 10);
          state.calCurrentMonth = parseInt(parts[1], 10) - 1;
        }
        render();
      }
    };
  });

  const addBtn = document.getElementById('calAddEventBtn');
  if(addBtn) addBtn.onclick = () => openAddCalendarEventModal(state.calSelectedDate);

  const agendaAddBtn = document.getElementById('agendaAddBtn');
  if(agendaAddBtn) agendaAddBtn.onclick = () => openAddCalendarEventModal(state.calSelectedDate);

  const emptyAddBtn = document.getElementById('emptyAddEvBtn');
  if(emptyAddBtn) emptyAddBtn.onclick = () => openAddCalendarEventModal(state.calSelectedDate);

  app.querySelectorAll('.quick-jump-date-btn').forEach(btn => {
    btn.onclick = () => {
      const d = btn.dataset.date;
      if(d){
        state.calSelectedDate = d;
        const parts = d.split('-');
        if(parts.length === 3){
          state.calCurrentYear = parseInt(parts[0], 10);
          state.calCurrentMonth = parseInt(parts[1], 10) - 1;
        }
        render();
      }
    };
  });

  app.querySelectorAll('.agenda-toggle').forEach(chk => {
    chk.onchange = () => {
      const id = chk.dataset.evid;
      const evs = getCalendarEvents();
      const ev = evs.find(e => e.id === id);
      if(ev){
        ev.completed = chk.checked;
        saveCalendarEvents(evs);
        render();
      }
    };
  });

  app.querySelectorAll('.del-ev-btn').forEach(btn => {
    btn.onclick = (e) => {
      e.stopPropagation();
      const id = btn.dataset.evid;
      if(confirm('Bu notu/etkinliği silmek istediğinize emin misiniz?')){
        const evs = getCalendarEvents().filter(e => e.id !== id);
        saveCalendarEvents(evs);
        showToast('Etkinlik silindi');
        render();
      }
    };
  });
}

function getMaterialsForClass(clsId){
  if(!clsId) return [];
  const key = 'takev_materials_' + clsId;
  try{
    const raw = localStorage.getItem(key);
    if(raw) return JSON.parse(raw);
  }catch(e){}
  const defaults = [
    { slot_no: 1, label: 'Ders Kitabı & Föy', check_date: todayStr() },
    { slot_no: 2, label: 'Deney Önlüğü & Gözlük', check_date: todayStr() },
    { slot_no: 3, label: 'Laboratuvar Defteri', check_date: todayStr() },
    { slot_no: 4, label: 'Soru Bankası & Defter', check_date: '' }
  ];
  saveMaterialsForClass(clsId, defaults);
  return defaults;
}

function saveMaterialsForClass(clsId, list){
  if(!clsId) return;
  try{
    localStorage.setItem('takev_materials_' + clsId, JSON.stringify(list || []));
  }catch(e){}
}

function getMaterialStatusForClass(clsId){
  if(!clsId) return {};
  const key = 'takev_mat_status_' + clsId;
  try{
    const raw = localStorage.getItem(key);
    if(raw) return JSON.parse(raw);
  }catch(e){}
  return {};
}

function saveMaterialStatusForClass(clsId, statusObj){
  if(!clsId) return;
  try{
    localStorage.setItem('takev_mat_status_' + clsId, JSON.stringify(statusObj || {}));
  }catch(e){}
}

function addMaterialCheck(label, checkDate){
  if(!state.cls) return;
  label = (label || '').trim();
  if(!label) return;
  const list = getMaterialsForClass(state.cls.id);
  const maxSlot = Math.max(0, ...list.map(m => m.slot_no || 0));
  const nextSlot = maxSlot + 1;
  list.push({
    slot_no: nextSlot,
    label,
    check_date: checkDate || todayStr()
  });
  saveMaterialsForClass(state.cls.id, list);
  state.cls.materials = list;
  showToast('Materyal kontrolü eklendi: ' + label);
  render();
}

function updateStudentMaterial(sid, slotNo, isDone){
  if(!state.cls) return;
  const statusObj = getMaterialStatusForClass(state.cls.id);
  statusObj[sid] = statusObj[sid] || {};
  statusObj[sid][slotNo] = !!isDone;
  saveMaterialStatusForClass(state.cls.id, statusObj);
  state.cls.materialStatus = statusObj;
}

      if(confirm('Bu materyal kontrol kaydı silinsin mi?')){

    const acBtn = document.getElementById('matAllClearBtn');

    const rnBtn = document.getElementById('matRenameBtn');

function renderStudentDetail(app){
  const s = studentById(state.studentId);
  if(!s){ return backToRoster(); }
  const cls = state.cls;
  const g12 = isGrade12(cls.name);
  const g11 = isGrade11(cls.name);
  const showTytAyt = g12 || g11;
  const today = todayStr();

  const hwP = hwPct(s.id);
  const mCount = missedCount(s.id);
  const flCount = fl27Count(s.id);
  const flRem = fl27Remainder(s.id);
  let perfSum=0, perfCount=0;
  if(!g12){ cls.perfTasks.forEach(t=>{ const g=rubricTotal(s.id,t.label).grade; if(g!=null){ perfSum+=g; perfCount++; } }); }
  const perfAvg = perfCount>0 ? Math.round(perfSum/perfCount) : '-';

  let quizHtml = '', perfHtml = '', tytHtml = '', aytHtml = '';
  if(!g12){
    let sortedQuizzes = sortQuizzes(cls.quizzes || []);
    quizHtml = sortedQuizzes.map(q=>{
      const v = (cls.quizScores[s.id]||{})[q.slot_no];
      const isQuiz = isQuizExam(q.label);
      let disp = '-';
      if(isQuiz){
        if(v && v.score != null){
          if(isGirmedi(v.score)){
            disp = '<span style="color:#d97706;font-weight:800;font-size:13px;background:#fef3c7;padding:1px 6px;border-radius:4px;border:1px solid #fde68a;">Girmedi (G)</span>';
          } else {
            disp = '<span style="color:var(--primary-deep);font-weight:900;font-size:15px;">' + v.score + '</span> <span style="font-size:11px;color:var(--ink-soft);font-weight:600;">Puan</span>';
          }
        }
      } else {
        if(v && (v.dogru != null || v.yanlis != null || v.bos != null)){
          const d = v.dogru ?? '-';
          const y = v.yanlis ?? '-';
          const b = v.bos ?? '-';
          const net = (v.dogru != null || v.yanlis != null) ? ((v.dogru||0) - ((v.yanlis||0)/4)).toFixed(2) : null;
          disp = 'D:' + d + ' Y:' + y + ' B:' + b + (net != null ? ' &middot; <span style="color:var(--primary);font-weight:900;">' + net + ' Net</span>' : '');
        }
      }
      const badge = examBadge(q.label, 'small');
      return '<div class="field"><label style="display:flex;align-items:center;justify-content:space-between;"><span>'+escapeHtml(formatExamLabel(q.label))+'</span>'+badge+'</label><div class="num" style="font-size:12px;font-weight:700;color:var(--primary-deep);">'+disp+'</div></div>';
    }).join('');
    perfHtml = cls.perfTasks.map(t=>{
      const total = rubricTotal(s.id, t.label);
      let dateSub = '';
      if(t.given_date && t.due_date){
        dateSub = '<span style="font-size:10.5px;color:var(--ink-faint);display:block;font-weight:normal;">Verildi: '+fmtDate(t.given_date)+' &middot; Kontrol: '+fmtDate(t.due_date)+'</span>';
      } else if(t.due_date){
        dateSub = '<span style="font-size:10.5px;color:var(--ink-faint);display:block;font-weight:normal;">Kontrol: '+fmtDate(t.due_date)+'</span>';
      } else if(t.given_date){
        dateSub = '<span style="font-size:10.5px;color:var(--ink-faint);display:block;font-weight:normal;">Verildi: '+fmtDate(t.given_date)+'</span>';
      }
      return '<div class="field"><label>'+escapeHtml(t.label)+dateSub+'</label><div class="num" style="font-size:16px;font-weight:800;color:var(--primary-deep);">'+(total.grade??'-')+'</div></div>';
    }).join('');
  }
  if(showTytAyt){
    const buildExamCards = (exams)=> exams.map(ex=>{
      const scores = (cls.denemeScoresByExam[ex.id]||{})[s.id] || {};
      const subjRows = (ex.subjects||[]).map(subj=>{
        const v = scores[subj]||{};
        return '<div style="display:flex;justify-content:space-between;font-size:12px;padding:3px 0;"><span style="color:var(--ink-soft);">'+escapeHtml(subj)+'</span><span style="font-weight:700;">D:'+(v.dogru??'-')+' Y:'+(v.yanlis??'-')+' B:'+(v.bos??'-')+'</span></div>';
      }).join('');
      return '<div class="card" style="padding:12px 14px;"><div style="font-weight:700;font-size:13.5px;margin-bottom:6px;">'+escapeHtml(ex.label)+'</div>'+(subjRows||'<div class="empty" style="padding:8px;">Not girilmemiş</div>')+'</div>';
    }).join('');
    tytHtml = buildExamCards(cls.tytExams);
    aytHtml = buildExamCards(cls.aytExams);
  }

  const hwRows = cls.homeworks.map(h=>{
    const future = !h.check_date || h.check_date>today;
    const done = !!(cls.hwStatus[s.id]||{})[h.slot_no];
    const dateLine = (h.hw_date?('Verildi: '+fmtDate(h.hw_date)):'Veriliş tarihi yok') + ' &middot; ' + (h.check_date?('Kontrol: '+fmtDate(h.check_date)):'Kontrol tarihi yok');
    return '<div class="hwrow '+(future?'future':'')+'">' +
      '<div class="topic"><div class="t">'+escapeHtml(h.topic||('Ödev #'+h.slot_no))+'</div><div class="d">'+dateLine+'</div></div>' +
      '<button class="toggle '+(done?'on':'')+'" data-slot="'+h.slot_no+'" '+(state.isAdmin || future ? 'disabled style="cursor:not-allowed;"' : '')+'><span class="knob"></span></button>' +
    '</div>';
  }).join('');

  let flStatusHtml = '';
  if(flCount > 0){
    flStatusHtml =
      '<div class="card fl27-banner-danger" style="margin-bottom:14px;">' +

      '<div class="detail-grid" style="margin-bottom:10px;">' +
        '<div class="field" style="text-align:left;"><label>Tarih</label><input type="date" id="counselDate" value="'+todayStr()+'" style="text-align:left;font-size:13px;font-weight:600;color:var(--ink);"></div>' +

      '<textarea id="counselNote" placeholder="Görüşme İçeriği..." style="width:100%;border:1px solid var(--line);border-radius:8px;padding:9px;font-family:inherit;font-size:13.5px;min-height:60px;resize:vertical;margin-bottom:10px;box-sizing:border-box;"></textarea>' +
      '<textarea id="counselEval" placeholder="Değerlendirme..." style="width:100%;border:1px solid var(--line);border-radius:8px;padding:9px;font-family:inherit;font-size:13.5px;min-height:50px;resize:vertical;margin-bottom:10px;box-sizing:border-box;"></textarea>' +
      '<button class="btn btn-primary full" id="addCounselBtn">'+ic('plus')+'Görüşme Notu Ekle</button>' +
    '</div>';

  return '<div class="section-title"><span>Görüşme Raporu</span><span class="line"></span></div>' +
    newNoteCard +
    (notes.map(n=>
      '<div class="card" style="padding:12px 14px;">' +
        '<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:6px;flex-wrap:wrap;gap:6px;">' +
          '<div style="display:flex;gap:8px;align-items:center;">' +
            '<span class="tag '+(n.meeting_type==='veli'?'teal':'blue')+'">'+typeLabel(n.meeting_type)+'</span>' +
            '<span style="font-weight:700;font-size:12.5px;color:var(--primary-deep);">'+fmtDate(n.note_date)+'</span>' +
          '</div>' +
          (!state.isAdmin ? '<button class="iconbtn" data-delnote="'+n.id+'">'+ic('trash')+'</button>' : '') +
        '</div>' +
        (n.interviewer ? '<div style="font-size:12px;color:var(--ink-soft);margin-bottom:4px;"><b>Görüşmeyi Yapan:</b> '+escapeHtml(n.interviewer)+'</div>' : '') +
        (n.reason ? '<div style="font-size:12px;color:var(--ink-soft);margin-bottom:4px;"><b>Neden:</b> '+escapeHtml(n.reason)+'</div>' : '') +
        '<div style="font-size:13.5px;white-space:pre-wrap;line-height:1.5;">'+escapeHtml(n.content)+'</div>' +
        (n.evaluation ? '<div style="font-size:13px;white-space:pre-wrap;line-height:1.5;margin-top:8px;padding-top:8px;border-top:1px solid var(--line);color:var(--ink-soft);"><b>Değerlendirme:</b> '+escapeHtml(n.evaluation)+'</div>' : '') +
      '</div>'
    ).join('') || '<div class="empty">Henüz görüşme notu eklenmedi.</div>');
}
function wireMeetingReportsSection(app, s){
  if(state.isAdmin) return;
  const picker = document.getElementById('mtypePicker');
  if(!picker) return;
  picker.querySelectorAll('[data-mtype]').forEach(btn=>{
    btn.onclick = ()=>{
      picker.dataset.selected = btn.dataset.mtype;
      picker.querySelectorAll('button').forEach(b=>b.classList.toggle('active', b===btn));
    };
  });
  const addBtn = document.getElementById('addCounselBtn');
  if(addBtn) addBtn.onclick = ()=>{
    const noteEl = document.getElementById('counselNote');
    if(!noteEl.value.trim()){ showToast('Görüşme içeriği boş olamaz'); return; }
    addCounselingNote(
      s.id, picker.dataset.selected,
      document.getElementById('counselDate').value,
      document.getElementById('counselInterviewer').value,
      document.getElementById('counselReason').value,
      noteEl.value,
      document.getElementById('counselEval').value
    );
  };
  app.querySelectorAll('[data-delnote]').forEach(btn=>{
    btn.onclick = ()=> deleteCounselingNote(s.id, btn.dataset.delnote);
  });
}

// ---- Ortak: sıralı meslek/üniversite ya da bölüm/üniversite satırları ----
function goalRowsHtml(prefix, count, existingGoals){
  existingGoals = existingGoals || [];
  let html = '';
  for(let i=0;i<count;i++){
    const g = existingGoals[i] || {};
    html += '<div style="display:flex;gap:6px;margin-bottom:6px;">' +
      '<div style="width:20px;font-size:11.5px;color:var(--ink-faint);padding-top:9px;text-align:center;">'+(i+1)+'</div>' +
      '<input type="text" data-'+prefix+'i="'+i+'" data-'+prefix+'f="profession" placeholder="Meslek/Bölüm" value="'+escapeHtml(g.profession||'')+'" '+(state.isAdmin?'disabled readonly':'')+' style="flex:1;min-width:0;border:1px solid var(--line);border-radius:8px;padding:8px;font-size:13px;box-sizing:border-box;'+(state.isAdmin?'background:var(--surface-2);cursor:not-allowed;':'')+'">' +
      '<input type="text" data-'+prefix+'i="'+i+'" data-'+prefix+'f="university" placeholder="Üniversite" value="'+escapeHtml(g.university||'')+'" '+(state.isAdmin?'disabled readonly':'')+' style="flex:1;min-width:0;border:1px solid var(--line);border-radius:8px;padding:8px;font-size:13px;box-sizing:border-box;'+(state.isAdmin?'background:var(--surface-2);cursor:not-allowed;':'')+'">' +
    '</div>';
  }
  return html;
}
function readGoalRows(app, prefix, count){
  const rows = [];
  for(let i=0;i<count;i++){
    const prof = app.querySelector('[data-'+prefix+'i="'+i+'"][data-'+prefix+'f="profession"]');
    const uni = app.querySelector('[data-'+prefix+'i="'+i+'"][data-'+prefix+'f="university"]');
    rows.push({ profession: prof?prof.value.trim():'', university: uni?uni.value.trim():'' });
  }
  return rows;
}

      '<div style="margin:10px 0;font-size:13px;">Almanya\'da eğitime devam etme isteği: ' +
        '<label style="margin-left:8px;"><input type="radio" name="ugGermany" value="evet"> Evet</label>' +

          '<div style="font-weight:700;font-size:13.5px;color:var(--primary-deep);">'+escapeHtml(g.period)+'</div>' +
          (!state.isAdmin ? '<button class="iconbtn" data-delug="'+g.id+'">'+ic('trash')+'</button>' : '') +
        '</div>' +
        ((g.goals||[]).map((goal,i)=>'<div style="font-size:12.5px;padding:2px 0;">'+(i+1)+'. '+escapeHtml(goal.profession||'-')+' — '+escapeHtml(goal.university||'-')+'</div>').join('') || '<div class="empty" style="padding:6px;">Kayıt yok</div>') +
        '<div style="font-size:12px;color:var(--ink-soft);margin-top:6px;">Almanya isteği: '+(g.germany_interest===true?'Evet':(g.germany_interest===false?'Hayır':'-'))+'</div>' +
      '</div>'
    ).join('') || '<div class="empty">Henüz üniversite hedefi girilmedi.</div>');
}
function wireUniversityGoalsSection(app, s){
  if(state.isAdmin) return;
  const addBtn = document.getElementById('addUgBtn');
  if(addBtn) addBtn.onclick = ()=>{
    const period = document.getElementById('ugPeriod').value;
    const goals = readGoalRows(app, 'ug', 5);
    const germanyRadio = app.querySelector('input[name="ugGermany"]:checked');
    const germanyInterest = germanyRadio ? (germanyRadio.value==='evet') : null;
    addUniversityGoals(s.id, period, goals, germanyInterest);
  };
  app.querySelectorAll('[data-delug]').forEach(btn=>{
    btn.onclick = ()=> deleteUniversityGoals(s.id, btn.dataset.delug);
  });
}

function wireAbroadConsultingSection(app, s){

  const syncAllBtn = document.getElementById('syncAllPerfBtn');
  if(syncAllBtn) syncAllBtn.onclick = syncAllPerfTasksToSameGrade;
  if(!state.isAdmin){
    app.querySelectorAll('input[data-old]').forEach(inp=>{
      inp.onblur = ()=>{ if(inp.value.trim() && inp.value.trim()!==inp.dataset.old) renamePerfTask(inp.dataset.old, inp.value.trim()); };
    });
    app.querySelectorAll('input[data-task][data-f]').forEach(inp=>{
      inp.onchange = ()=>{
        const currentVal = inp.value ? inp.value.trim() : null;
        const task = state.cls.perfTasks.find(x => x.label === inp.dataset.task);
        const oldVal = (task && task[inp.dataset.f]) ? task[inp.dataset.f].trim() : null;
        if(currentVal !== oldVal){
          updatePerfTaskDate(inp.dataset.task, inp.dataset.f, currentVal);
        }
      };
    });
    app.querySelectorAll('[data-del]').forEach(btn=>{
      btn.onclick = ()=>{ if(confirm('"'+btn.dataset.del+'" silinsin mi? Tüm ölçüt ve puanlar da silinir.')) deletePerfTask(btn.dataset.del); };
    });
  }
  app.querySelectorAll('[data-enter]').forEach(btn=>{
    btn.onclick = ()=>{ state.rubricLevel = btn.dataset.enter; state.view='rubric'; render(); };
  });
}

function renderRubric(app){
  if(state.isAdmin) state.rubricEdit = false;
  const level = state.rubricLevel;
  const crit = state.cls.rubrics[level] || [];
  const sid = state.studentId;
  const totals = sid ? rubricTotal(sid, level) : {sum:0,max:0,grade:null};
  const grade = getGradeLevel(state.cls.name);
  const sameGrade = getSameGradeClasses(state.cls);

  const topControls =
    '<button class="backlink" id="back5">'+ic('chevron')+' '+escapeHtml(state.cls.name)+' paneline dön</button>' +
    (state.isAdmin ? '<div style="background:var(--amber-soft);border:1px solid var(--amber);border-radius:var(--radius-sm);padding:8px 14px;margin-bottom:12px;color:#8a4d05;font-size:12.5px;font-weight:700;">👁️ Yönetici İzleme Modu (Salt Okunur)</div>' : '') +
    '<div class="pagehead"><h2>Performans Ödevi</h2><div class="sub">'+escapeHtml(level||'')+'</div></div>' +
    '<div class="levelpicker">' +

      (!state.isAdmin ? '<button class="btn btn-outline btn-sm" id="editToggle">'+(state.rubricEdit?'Bitti':'Ölçütleri Düzenle')+'</button>' : '') +
      (!state.isAdmin ? '<button class="btn btn-soft btn-sm" id="syncRubricBtn" title="Bu rubriği diğer kullanıcılar dahil tüm '+grade+'. sınıflara aktar">'+ic('upload')+'Tüm '+grade+' lara Eşitle (Tüm Kullanıcılar)</button>' : '') +
      (!state.isAdmin ? '<button class="btn btn-outline btn-sm" id="manageTasksBtn">'+ic('book')+'Ödevleri Yönet</button>' : '') +
    '</div>';

    '<div style="font-size:12.5px;color:var(--ink-soft);margin:0 0 16px;display:flex;gap:16px;flex-wrap:wrap;background:var(--surface);padding:10px 14px;border-radius:var(--radius-sm);border:1px solid var(--line);">' +
      '<span>📅 <b>Verilme Tarihi:</b> '+(currentTask.given_date ? fmtDate(currentTask.given_date) : 'Belirtilmedi')+'</span>' +
      '<span>⏰ <b>Kontrol / Teslim Tarihi:</b> '+(currentTask.due_date ? fmtDate(currentTask.due_date) : 'Belirtilmedi')+'</span>' +
    '</div>' : '';

  let body = '';

    const editNotice =
      '<div style="font-size:12px;color:var(--primary);background:var(--primary-soft);padding:8px 12px;border-radius:8px;margin-bottom:12px;">' +
        'ℹ️ Düzenlediğiniz rubrik ölçütleri otomatik olarak diğer tüm <b>'+grade+'. sınıflara</b> (diğer öğretmenlerin sınıfları dahil) yansıtılır.' +
      '</div>';
    body = editNotice + crit.map((c,ci)=>{
      const levels = (c.levels||[]).map((lv,li)=>
        '<div class="levelcard" style="cursor:default;">' +
          '<div style="display:flex;gap:8px;margin-bottom:6px;">' +
            '<input type="number" value="'+lv.score+'" data-ci="'+ci+'" data-li="'+li+'" data-f="score" style="width:56px;border:1px solid var(--line);border-radius:6px;padding:6px;font-weight:700;">' +
            '<input type="text" value="'+escapeHtml(lv.label)+'" data-ci="'+ci+'" data-li="'+li+'" data-f="label" style="flex:1;border:1px solid var(--line);border-radius:6px;padding:6px;">' +
            '<button class="iconbtn" data-dellvl="'+ci+':'+li+'">'+ic('trash')+'</button>' +
          '</div>' +
          '<textarea data-ci="'+ci+'" data-li="'+li+'" data-f="desc" placeholder="Açıklama" style="width:100%;border:1px solid var(--line);border-radius:6px;padding:6px;font-family:inherit;font-size:12.5px;min-height:40px;">'+escapeHtml(lv.desc||'')+'</textarea>' +
        '</div>'
      ).join('');
      return '<div class="critblock">' +
        '<div style="display:flex;gap:8px;align-items:center;margin-bottom:8px;">' +
          '<input type="text" value="'+escapeHtml(c.name)+'" data-crit="'+ci+'" data-f="name" style="flex:1;border:1px solid var(--line);border-radius:6px;padding:8px;font-weight:700;">' +
          'Tam puan: <input type="number" value="'+c.max+'" data-crit="'+ci+'" data-f="max" style="width:50px;border:1px solid var(--line);border-radius:6px;padding:8px;">' +
          '<button class="btn btn-danger btn-sm" data-delcrit="'+ci+'">Sil</button>' +
        '</div>' + levels +
        '<button class="btn btn-outline btn-sm" data-addlvl="'+ci+'" style="width:100%;justify-content:center;margin-top:4px;">+ Seviye Ekle</button>' +
      '</div>';
    }).join('') + '<button class="btn btn-soft full" id="addCritBtn">'+ic('plus')+'Yeni Ölçüt Ekle</button>';
  } else {
    const summaryRows = state.cls.students.map(s=>{
      const t = rubricTotal(s.id, level);
      const badge = t.grade!=null?t.grade:'-';
      const low = t.grade!=null && t.grade<60;
      return '<div class="card rowcard" data-sumid="'+s.id+'" style="margin-bottom:6px;">' +
        '<div class="name">'+escapeHtml(s.name)+'</div>' +
        '<div class="pct '+(low?'low':'')+'">'+badge+'</div>' +
        '<div class="chev">'+ic('chevron')+'</div>' +
      '</div>';
    }).join('');
    const studentButtons = state.cls.students.map(s=>
      '<button class="'+(s.id===sid?'active':'')+'" data-id="'+s.id+'">'+escapeHtml(s.name)+'</button>'
    ).join('');
    const critHtml = crit.map((c,ci)=>{
      const curScore = sid ? ((state.cls.rubricScores[sid]||{})[level]||{})[ci] : null;
      const levels = (c.levels||[]).map(lv=>
        '<div class="levelcard '+(curScore===lv.score?'sel':'')+'" data-ci="'+ci+'" data-score="'+lv.score+'" '+(state.isAdmin?'style="cursor:default;"':'')+'>' +
          '<div class="lh"><span>'+escapeHtml(lv.label)+'</span><span class="score">'+lv.score+' puan</span></div>' +
          '<div class="desc">'+escapeHtml(lv.desc)+'</div>' +
        '</div>'
      ).join('');
      return '<div class="critblock"><h3>'+escapeHtml(c.name)+' <span class="max">(tam puan: '+c.max+')</span></h3>'+levels+'</div>';
    }).join('');
    body = (crit.length===0 ? '<div class="empty">Bu performans için henüz ölçüt tanımlanmadı.<br>Yukarıdaki "Ölçütleri Düzenle" ile ekleyebilirsin.' + (!state.isAdmin ? '<div style="margin-top:12px;"><button class="btn btn-primary btn-sm" id="emptyAddCritBtn">+ Ölçütleri Düzenle / Ekle</button></div>' : '') + '</div>' :
      '<div class="section-title"><span>Sınıf Özeti</span><span class="line"></span></div>' +
      (summaryRows || '<div class="empty">Öğrenci yok.</div>') +
      '<div class="section-title" style="margin-top:24px;"><span>'+(sid?'Puanlama':'Puanlamak için öğrenci seç')+'</span><span class="line"></span></div>' +
      '<div class="studentpicker">'+studentButtons+'</div>' +
      (sid ?
        '<div class="rubricsummary">' +
          '<div><div class="lbl">Toplam</div><div class="num">'+totals.sum+' / '+totals.max+'</div></div>' +
          '<div><div class="lbl">Not</div><div class="num">'+(totals.grade!=null?totals.grade:'-')+'</div></div>' +
        '</div>' + critHtml
        : ''));
  }

  app.innerHTML = topControls + taskDatesHtml + body;

  document.getElementById('back5').onclick = backToRoster;
  const editToggleBtn = document.getElementById('editToggle');
  if(editToggleBtn) editToggleBtn.onclick = ()=>{ state.rubricEdit = !state.rubricEdit; render(); };
  const emptyAddCritBtn = document.getElementById('emptyAddCritBtn');
  if(emptyAddCritBtn) emptyAddCritBtn.onclick = ()=>{ state.rubricEdit = true; render(); };
  const manageTasksBtn = document.getElementById('manageTasksBtn');
  if(manageTasksBtn) manageTasksBtn.onclick = ()=>{ state.view='perfTasks'; render(); };
  const syncRubricBtn = document.getElementById('syncRubricBtn');
  if(syncRubricBtn) syncRubricBtn.onclick = ()=> syncRubricToSameGrade(level);
  app.querySelectorAll('.levelpicker button[data-lvl]').forEach(b=>{
    b.onclick = ()=>{ state.rubricLevel = b.dataset.lvl; render(); };
  });

  if(state.rubricEdit && !state.isAdmin){
    document.getElementById('addCritBtn').onclick = ()=> addCriterion(level);
    app.querySelectorAll('[data-delcrit]').forEach(b=> b.onclick = ()=> deleteCriterion(level, parseInt(b.dataset.delcrit)));
    app.querySelectorAll('[data-addlvl]').forEach(b=> b.onclick = ()=> addLevel(level, parseInt(b.dataset.addlvl)));
    app.querySelectorAll('[data-dellvl]').forEach(b=>{
      b.onclick = ()=>{ const [ci,li]=b.dataset.dellvl.split(':').map(Number); deleteLevel(level,ci,li); };
    });
    app.querySelectorAll('input[data-crit]').forEach(inp=>{
      inp.onblur = ()=> updateCriterion(level, parseInt(inp.dataset.crit), inp.dataset.f, inp.value);
    });
    app.querySelectorAll('[data-ci][data-li]').forEach(inp=>{
      inp.onblur = ()=> updateLevel(level, parseInt(inp.dataset.ci), parseInt(inp.dataset.li), inp.dataset.f, inp.value);
    });
  } else {
    app.querySelectorAll('[data-sumid]').forEach(el=>{
      el.onclick = ()=>{
        state.studentId = el.dataset.sumid;
        render();
        const picker = app.querySelector('.studentpicker');
        if(picker) picker.scrollIntoView({behavior:'smooth', block:'center'});
      };
    });
    app.querySelectorAll('.studentpicker button').forEach(b=>{
      b.onclick = ()=>{
        state.studentId = b.dataset.id;
        render();
        const picker = app.querySelector('.studentpicker');
        if(picker) picker.scrollIntoView({behavior:'smooth', block:'center'});
      };
    });
    if(!state.isAdmin){
      app.querySelectorAll('.levelcard[data-ci]').forEach(el=>{
        el.onclick = ()=>{
          const ci = parseInt(el.dataset.ci), score = parseInt(el.dataset.score);
          const cur = ((state.cls.rubricScores[sid]||{})[level]||{})[ci];
          setRubricScore(sid, level, ci, cur===score?null:score);
        };
      });
    }
  }
}

  const slotNo = state.activeSlot;
  const q = state.cls.quizzes.find(x => x.slot_no === slotNo);
  if(!q){ state.view = 'quizzes'; return render(); }

  const isQuiz = isQuizExam(q.label);
  const badge = examBadge(q.label);

  const students = sortedStudents();

    if(eqBtn) eqBtn.onclick = () => document.getElementById('excelQuizFile').click();
    const eqFile = document.getElementById('excelQuizFile');

    // Score inputs with Enter & Arrow keys navigation & live updates
    const allInputs = Array.from(app.querySelectorAll('input[data-id]'));
    allInputs.forEach(inp => {

          const isG = isGirmedi(val);

          if(stEl){
            if(isG){
              stEl.innerHTML = '<span style="color:#d97706;background:#fef3c7;padding:2px 8px;border-radius:6px;font-weight:800;font-size:12px;border:1px solid #fde68a;">Girmedi</span>';
            } else if(val === ''){
              stEl.innerHTML = '<span style="color:var(--ink-faint);font-size:11.5px;">—</span>';
            } else {
              const num = parseFloat(val.replace(',', '.'));
              if(!isNaN(num)){
                stEl.innerHTML = num >= 50
                  ? '<span style="color:#059669;font-weight:800;font-size:12px;">Başarılı</span>'
                  : '<span style="color:#dc2626;font-weight:800;font-size:12px;">Geliştirilmeli</span>';
              } else {
                stEl.innerHTML = '<span style="color:var(--ink-faint);font-size:11.5px;">—</span>';
              }
            }
          }
        };
      } else {
        inp.oninput = () => {
          const rowEl = inp.closest('.scorerow');
          if(rowEl){
            const dInp = rowEl.querySelector('input[data-f="dogru"]');
            const yInp = rowEl.querySelector('input[data-f="yanlis"]');
            const netEl = rowEl.querySelector('.kds-net-val');
            if(dInp && yInp && netEl){
              const d = parseInt(dInp.value) || 0;
              const y = parseInt(yInp.value) || 0;
              const hasVal = dInp.value.trim() !== '' || yInp.value.trim() !== '';
              netEl.textContent = hasVal ? (d - (y / 4)).toFixed(2) : '-';
            }
          }
        };
      }

      inp.onblur = () => {
        if(isQuiz && isGirmedi(inp.value)){
          inp.value = 'G';
        }
        updateQuizDYB(inp.dataset.id, slotNo, inp.dataset.f, inp.value);
      };
      inp.addEventListener('keydown', (e) => {
        const curRow = parseInt(inp.dataset.row, 10);
        const curCol = parseInt(inp.dataset.col, 10);

        if(e.key === 'Enter' || e.key === 'ArrowDown'){
          e.preventDefault();
          const next = allInputs.find(i => parseInt(i.dataset.row, 10) === curRow + 1 && parseInt(i.dataset.col, 10) === curCol);
          if(next){ next.focus(); next.select(); }
          else { inp.blur(); }
        } else if(e.key === 'ArrowUp'){
          e.preventDefault();
          const prev = allInputs.find(i => parseInt(i.dataset.row, 10) === curRow - 1 && parseInt(i.dataset.col, 10) === curCol);
          if(prev){ prev.focus(); prev.select(); }
        } else if(!isQuiz && e.key === 'ArrowRight'){
          const nextCol = allInputs.find(i => parseInt(i.dataset.row, 10) === curRow && parseInt(i.dataset.col, 10) === curCol + 1);
          if(nextCol){ e.preventDefault(); nextCol.focus(); nextCol.select(); }
        } else if(!isQuiz && e.key === 'ArrowLeft'){
          const prevCol = allInputs.find(i => parseInt(i.dataset.row, 10) === curRow && parseInt(i.dataset.col, 10) === curCol - 1);
          if(prevCol){ e.preventDefault(); prevCol.focus(); prevCol.select(); }
        }
      });
    });
  }
}

function calcDenemeAverages(examId, subjects){
  const students = sortedStudents();
  const scores = state.cls.denemeScoresByExam[examId]||{};
  const stats = (subjects||[]).map(subj=>{
    let count=0, sumD=0, sumY=0, sumB=0;
    students.forEach(s=>{
      const rec = (scores[s.id]||{})[subj];
      if(!rec) return;
      const hasD = rec.dogru!=null && rec.dogru!=='';
      const hasY = rec.yanlis!=null && rec.yanlis!=='';
      const hasB = rec.bos!=null && rec.bos!=='';
      if(hasD || hasY || hasB){
        count++;
        if(hasD) sumD += (Number(rec.dogru)||0);
        if(hasY) sumY += (Number(rec.yanlis)||0);
        if(hasB) sumB += (Number(rec.bos)||0);
      }
    });
    if(count===0){
      return { subj, count:0, d:'-', y:'-', b:'-', net:'-', netNum:0 };
    }
    const dAvg = sumD / count;
    const yAvg = sumY / count;
    const bAvg = sumB / count;
    const netAvg = dAvg - (yAvg / 4);
    return {
      subj,
      count,
      d: (Math.round(dAvg*10)/10).toFixed(1),
      y: (Math.round(yAvg*10)/10).toFixed(1),
      b: (Math.round(bAvg*10)/10).toFixed(1),
      net: (Math.round(netAvg*100)/100).toFixed(2),
      netNum: netAvg
    };
  });
  const activeStats = stats.filter(st=>st.count>0);
  const totalNet = activeStats.length>0
    ? (Math.round(activeStats.reduce((sum,st)=>sum+st.netNum,0)*100)/100).toFixed(2)
    : null;
  return { stats, totalNet };
}

function updateDenemeAveragesDom(examId){
  if(state.view!=='deneme_scores' || state.activeExamId!==examId) return;
  const exam = (state.examType==='tyt'?state.cls.tytExams:state.cls.aytExams).find(e=>e.id===examId);
  if(!exam) return;
  const subjects = exam.subjects||[];
  const { stats, totalNet } = calcDenemeAverages(examId, subjects);
  stats.forEach(st=>{
    try {
      const escapedSubj = CSS.escape(st.subj);
      const elD = document.querySelector('[data-avg-d="'+escapedSubj+'"]');
      if(elD) elD.textContent = st.d;
      const elY = document.querySelector('[data-avg-y="'+escapedSubj+'"]');
      if(elY) elY.textContent = st.y;
      const elB = document.querySelector('[data-avg-b="'+escapedSubj+'"]');
      if(elB) elB.textContent = st.b;
      const elNet = document.querySelector('[data-avg-net="'+escapedSubj+'"] span');
      if(elNet) elNet.textContent = st.net!=='-' ? (st.net+' Net') : '-';
    } catch(e){}
  });
  const elTot = document.getElementById('denemeTotalNetBadge');
  if(elTot){
    elTot.textContent = totalNet ? ('(Top: ' + totalNet + ')') : '';
    elTot.style.display = totalNet ? 'inline' : 'none';
  }
}

    const rowBg = (idx % 2 === 1) ? 'var(--bg)' : 'var(--surface)';
    return '<tr style="background:'+rowBg+';">' +

      '<td style="position:sticky;left:45px;z-index:5;background:'+rowBg+';padding:6px 10px;font-size:13px;font-weight:700;white-space:nowrap;min-width:160px;border-bottom:1px solid var(--line);border-right:2px solid var(--line);box-shadow:3px 0 6px -2px rgba(0,0,0,0.08);">'+escapeHtml(s.name)+'</td>' +
      cells +
    '</tr>';
  }).join('');

  const { stats, totalNet } = calcDenemeAverages(examId, subjects);

  const avgCells = stats.map(st=>{
    return '<td data-avg-d="'+escapeHtml(st.subj)+'" style="padding:5px 2px;text-align:center;font-size:11.5px;font-weight:800;color:var(--teal);border-top:2px solid var(--line);border-bottom:1px solid var(--line);background:var(--surface-2);">'+st.d+'</td>' +
      '<td data-avg-y="'+escapeHtml(st.subj)+'" style="padding:5px 2px;text-align:center;font-size:11.5px;font-weight:800;color:var(--red);border-top:2px solid var(--line);border-bottom:1px solid var(--line);background:var(--surface-2);">'+st.y+'</td>' +
      '<td data-avg-b="'+escapeHtml(st.subj)+'" style="padding:5px 2px;text-align:center;font-size:11.5px;font-weight:800;color:var(--ink-soft);border-top:2px solid var(--line);border-bottom:1px solid var(--line);border-right:1px solid var(--line);background:var(--surface-2);">'+st.b+'</td>';
  }).join('');

  const netCells = stats.map(st=>{
    const netTxt = st.net!=='-' ? (st.net+' Net') : '-';
    return '<td colspan="3" data-avg-net="'+escapeHtml(st.subj)+'" style="padding:4px 3px;text-align:center;font-size:11.5px;font-weight:800;border-bottom:none;border-right:1px solid var(--line);background:var(--surface-2);">' +
      '<span style="background:var(--primary-soft);color:var(--primary-deep);padding:2px 8px;border-radius:6px;display:inline-block;white-space:nowrap;">'+netTxt+'</span>' +

  const tfootHtml =

      '<tr style="background:var(--surface-2);">' +
        '<td style="position:sticky;left:0;z-index:25;background:var(--surface-2);padding:6px 4px;font-size:11px;font-weight:800;text-align:center;border-top:2px solid var(--line);border-bottom:1px solid var(--line);border-right:1px solid var(--line);color:var(--primary-deep);width:45px;min-width:45px;">ORT</td>' +
        '<td style="position:sticky;left:45px;z-index:25;background:var(--surface-2);padding:6px 10px;font-size:12px;font-weight:800;white-space:nowrap;min-width:160px;border-top:2px solid var(--line);border-bottom:1px solid var(--line);border-right:2px solid var(--line);box-shadow:3px 0 6px -2px rgba(0,0,0,0.08);color:var(--primary-deep);">Sınıf Ortalaması (D-Y-B)</td>' +
        avgCells +
      '</tr>' +
      '<tr style="background:var(--surface-2);">' +
        '<td style="position:sticky;left:0;z-index:25;background:var(--surface-2);padding:6px 4px;font-size:11px;font-weight:800;text-align:center;border-bottom:none;border-right:1px solid var(--line);color:var(--teal);width:45px;min-width:45px;">NET</td>' +
        '<td style="position:sticky;left:45px;z-index:25;background:var(--surface-2);padding:6px 10px;font-size:12px;font-weight:800;white-space:nowrap;min-width:160px;border-bottom:none;border-right:2px solid var(--line);box-shadow:3px 0 6px -2px rgba(0,0,0,0.08);color:var(--ink);">Ortalama Net <span id="denemeTotalNetBadge" style="color:var(--teal);font-weight:800;margin-left:4px;font-size:11.5px;'+(totalNet?'':'display:none;')+'">'+(totalNet?('(Top: '+totalNet+')'):'')+'</span></td>' +
        netCells +
      '</tr>' +
    '</tfoot>';

  app.innerHTML =
    '<button class="backlink" id="backDS">'+ic('chevron')+' '+(examType==='tyt'?'TYT':'AYT')+' listesine dön</button>' +
    (state.isAdmin ? '<div class="admin-badge-banner" style="background:var(--amber-soft);border:1px solid var(--amber);color:var(--amber);padding:10px 14px;border-radius:10px;font-size:12.5px;font-weight:700;margin-bottom:14px;display:flex;align-items:center;gap:8px;">Yönetici Modu (Salt Okunur) — Deneme notları sadece incelenebilir.</div>' : '') +
    '<div class="pagehead" style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px;">' +
      '<h2 style="margin:0;">'+escapeHtml(exam.label)+'</h2>' +
      (!state.isAdmin ? '<button class="btn btn-danger btn-sm" id="delThisExamBtn">'+ic('trash')+'Bu Sınavı Sil</button>' : '') +
    '</div>' +
    '<div class="card" style="max-height:calc(100vh - 190px);min-height:360px;overflow:auto;padding:0;border-radius:var(--radius);border:1px solid var(--line);box-shadow:var(--shadow);">' +
      '<table style="border-collapse:separate;border-spacing:0;width:100%;">' +
        '<thead>' +
          '<tr>' +
            '<th rowspan="2" style="position:sticky;left:0;top:0;z-index:30;background:var(--surface-2);padding:0 8px;font-size:11px;text-align:left;border-bottom:2px solid var(--line);border-right:1px solid var(--line);color:var(--ink-soft);width:45px;min-width:45px;">No</th>' +
            '<th rowspan="2" style="position:sticky;left:45px;top:0;z-index:30;background:var(--surface-2);padding:0 10px;font-size:12px;font-weight:800;text-align:left;border-bottom:2px solid var(--line);border-right:2px solid var(--line);color:var(--ink);white-space:nowrap;min-width:160px;box-shadow:3px 0 6px -2px rgba(0,0,0,0.08);">Öğrenci Adı Soyadı</th>' +

          '</tr>' +
          '<tr>' +
            subHeaderCells +
          '</tr>' +
        '</thead>' +
        '<tbody>'+(rows||'')+'</tbody>' +
        tfootHtml +

    '</div>';
  document.getElementById('backDS').onclick = ()=>{ state.view='deneme_list'; render(); };

    const delBtn = document.getElementById('delThisExamBtn');
    if(delBtn){
      delBtn.onclick = ()=>{
        if(confirm('Bu "'+exam.label+'" sınavı ve kayıtlı tüm notları silinsin mi?')){
          deleteDenemeExam(examId, examType);
        }
      };
    }
    app.querySelectorAll('input[data-id]').forEach(inp=>{
      inp.onblur = ()=> updateDenemeScore(inp.dataset.id, examId, inp.dataset.subj, inp.dataset.f, inp.value);
    });
  }
}

(async function init(){
  const { data: { session } } = await sb.auth.getSession();
  if(session){ await startApp(); } else { state.page='login'; render(); }
  sb.auth.onAuthStateChange((event)=>{
    if(event==='SIGNED_OUT'){
      document.getElementById('teacherBtn').style.display='none';
    }
  });
})();

// --- PWA & Android Kurulum Yönetimi ---
(function setupPwa() {
  const isStandalone = window.matchMedia('(display-mode: standalone)').matches || ('standalone' in navigator && navigator.standalone);

  // 1. Service Worker Kaydı
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('./sw.js')
        .then((reg) => {
          console.log('[PWA] Service Worker aktif:', reg.scope);
          reg.addEventListener('updatefound', () => {
            const installing = reg.installing;
            if (!installing) return;
            installing.addEventListener('statechange', () => {
              if (installing.state === 'installed' && navigator.serviceWorker.controller) {
                showToast('Ödev Takip güncellendi, yeni sürüm hazır.');
              }
            });
          });
        })
        .catch((err) => {
          console.warn('[PWA] Service Worker hatası:', err);
        });
    });
  }

  // Eğer zaten uygulama olarak açılmışsa yükleme butonunu gösterme
  if (isStandalone) {
    console.log('[PWA] Uygulama tam ekran / standalone modda çalışıyor.');
    return;
  }

  let deferredPrompt = null;
  const headerBtn = document.getElementById('pwaInstallHeaderBtn');
  const banner = document.getElementById('pwaInstallBanner');
  const bannerInstallBtn = document.getElementById('pwaBannerInstallBtn');
  const bannerDismissBtn = document.getElementById('pwaBannerDismissBtn');

  if (headerBtn) {
    headerBtn.style.display = 'inline-flex';
    headerBtn.onclick = () => triggerInstallPrompt();
  }

  // 2. Tarayıcının yerel yükleme olayını yakalama
  window.addEventListener('beforeinstallprompt', (e) => {
    e.preventDefault();
    deferredPrompt = e;

    const dismissedUntil = localStorage.getItem('pwa_banner_dismissed_until');
    if (!dismissedUntil || Date.now() > parseInt(dismissedUntil, 10)) {
      if (banner) banner.style.display = 'flex';
    }
    if (headerBtn) headerBtn.style.display = 'inline-flex';
  });

  if (bannerInstallBtn) {
    bannerInstallBtn.onclick = () => triggerInstallPrompt();
  }

  if (bannerDismissBtn) {
    bannerDismissBtn.onclick = () => {
      if (banner) banner.style.display = 'none';
      localStorage.setItem('pwa_banner_dismissed_until', String(Date.now() + 3 * 24 * 60 * 60 * 1000));
    };
  }

  window.addEventListener('appinstalled', () => {
    deferredPrompt = null;
    if (banner) banner.style.display = 'none';
    if (headerBtn) headerBtn.style.display = 'none';
    showToast('🎉 Ödev Takip uygulaması başarıyla yüklendi!');
  });

  async function triggerInstallPrompt() {
    if (deferredPrompt) {
      deferredPrompt.prompt();
      const { outcome } = await deferredPrompt.userChoice;
      if (outcome === 'accepted') {
        if (banner) banner.style.display = 'none';
        if (headerBtn) headerBtn.style.display = 'none';
      }
      deferredPrompt = null;
    } else {
      const isIos = /iPad|iPhone|iPod/.test(navigator.userAgent) && !window.MSStream;
      if (isIos) {
        alert('iOS cihazınızda yüklemek için Safari menüsünden "Paylaş" butonuna basıp "Ana Ekrana Ekle" seçeneğini seçebilirsiniz.');
      } else {
        alert('Android cihazınızda Chrome veya tarayıcınızın sağ üst köşesindeki üç nokta (⋮) menüsüne dokunup "Uygulamayı Yükle" veya "Ana Ekrana Ekle" seçeneğini seçerek Ödev Takip uygulamasını telefonunuza yükleyebilirsiniz.');
      }
    }
  }
})();
