name: Otomatik Yedekleme

on:
  schedule:
    - cron: '0 20 * * *'   # Her gün 20:00 UTC = 23:00 Türkiye saati
  workflow_dispatch: {}     # "Run workflow" ile elle tetikleme

# Yedekler öğrenci verisi içerdiği için depoya yazılmaz; sadece okuma izni yeterli.
permissions:
  contents: read

concurrency:
  group: backup
  cancel-in-progress: false

jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Repoyu indir
        uses: actions/checkout@v4

      - name: Node.js kur
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Paketleri kur
        run: npm ci --no-audit --no-fund

      - name: Yedekleme scriptini çalıştır
        env:
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          TEACHER_USERNAME: ${{ secrets.TEACHER_USERNAME }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          GOOGLE_REFRESH_TOKEN: ${{ secrets.GOOGLE_REFRESH_TOKEN }}
          GOOGLE_DRIVE_FOLDER_ID: ${{ secrets.GOOGLE_DRIVE_FOLDER_ID }}
          GOOGLE_SERVICE_ACCOUNT_KEY: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_KEY }}
        run: node .github/scripts/backup.mjs

      # Script hata verse bile o ana kadar alınan yedekler kaybolmasın.
      - name: Yedekleri GitHub Artifact olarak sakla
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gunluk-yedekler
          path: backups/
          retention-days: 90
          if-no-files-found: warn
